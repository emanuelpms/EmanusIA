[project]
name = "emanusia"
version = "0.1.0"
description = "Funcionário-robô local: agente de IA (Ollama) para automação web, Excel, Power BI, dashboards e SAP"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27", "pydantic>=2", "pyyaml", "openpyxl", "pandas", "plotly",
  "playwright", "fastapi", "uvicorn", "cryptography", "lxml", "pdfplumber",
]

[project.optional-dependencies]
sap = ["pywin32; sys_platform == 'win32'"]
desktop = ["pywinauto; sys_platform == 'win32'", "pyautogui", "pillow", "pywin32; sys_platform == 'win32'"]
gui = ["pywebview"]
sql = ["pyodbc"]
all = ["emanusia[sap,desktop,gui,sql]"]
dev = ["pytest", "httpx", "pillow"]

[project.scripts]
emanusia = "emanusia.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emanusia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
emanusia = ["static/*"]
