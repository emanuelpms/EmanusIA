<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EmanusIA</title>
<style>
:root{--bg:#0b1220;--side:#0f1729;--card:#131c2e;--fg:#e6ecf5;--mut:#8a97ad;--line:#22304a;--acc:#4f8cff;--ok:#22c7a9;--warn:#ffb020;--bad:#ff6b6b}
@media(prefers-color-scheme:light){:root{--bg:#f4f6fb;--side:#fff;--card:#fff;--fg:#0f172a;--mut:#64748b;--line:#e2e8f0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Segoe UI",sans-serif;display:flex;height:100vh}
nav{width:220px;background:var(--side);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
nav h1{font-size:19px;margin:0 8px 14px}nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:9px;color:var(--mut)}
nav button:hover{background:var(--line)}nav button.on{background:var(--acc);color:#fff}nav .sp{flex:1}
nav .who{font-size:12px;color:var(--mut);padding:6px 10px}
main{flex:1;overflow:auto;padding:24px 28px}main.full{padding:0;overflow:hidden}main.full iframe{border:0;width:100%;height:100%;display:block}h2{margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
button.b,a.b{all:unset;cursor:pointer;background:var(--acc);color:#fff;padding:7px 14px;border-radius:9px;font-size:14px;display:inline-block}
button.b.sec,a.b.sec{background:var(--line);color:var(--fg)}button.b.bad{background:var(--bad)}button.b:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;width:100%}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:13px}label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mut{color:var(--mut)}.small{font-size:13px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:14px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line)}.tag.done{background:var(--ok);color:#00201a}
.tag.error{background:var(--bad);color:#fff}.tag.running,.tag.queued{background:var(--acc);color:#fff}.tag.waiting_approval{background:var(--warn);color:#2b1c00}
.chip{display:inline-block;font-size:12px;background:var(--line);border-radius:8px;padding:1px 8px;margin:2px 3px 2px 0}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9}.modal.show{display:flex}
.modal>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(560px,92vw);max-height:90vh;overflow:auto}
pre{background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:9px;white-space:pre-wrap;font-size:12.5px;max-height:260px;overflow:auto}
#rec{display:none;background:var(--warn);color:#2b1c00;padding:10px 14px;border-radius:12px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#4f8cff22,#22c7a922);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.hero h3{margin:0 0 4px;font-size:19px}.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:10px 0}
.how div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px}.how b{display:block;font-size:22px;color:var(--acc)}
button.big{font-size:16px;padding:11px 20px;border-radius:12px}
.track{display:flex;gap:4px;margin:12px 0;flex-wrap:wrap}.track span{flex:1;min-width:88px;text-align:center;font-size:12px;padding:6px 4px;border-radius:8px;background:var(--line);color:var(--mut)}
.track span.ok{background:var(--ok);color:#00201a}.track span.now{background:var(--acc);color:#fff;font-weight:600}
.steps{list-style:none;margin:8px 0;padding:0}.st{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--bg)}
.st.bad{border-color:var(--bad);background:#ff6b6b14}.st .num{width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.st .tx{flex:1;min-width:0}.st .acts{display:flex;gap:4px;flex:none}.st .acts button{all:unset;cursor:pointer;padding:2px 6px;border-radius:6px;color:var(--mut)}.st .acts button:hover{background:var(--line)}
.st img{max-width:min(320px,100%);border-radius:6px;border:1px solid var(--line);cursor:zoom-in;margin-top:6px;display:block}
.note{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}.note.bad{background:#ff6b6b1f;border:1px solid var(--bad)}.note.warn{background:#ffb0201f;border:1px solid var(--warn)}.note.ok{background:#22c7a91f;border:1px solid var(--ok)}
.recbar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f3a5f;color:#fff;border-radius:16px;padding:14px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px #0008;z-index:20;max-width:92vw}
@media(max-width:700px){nav{width:64px}nav button{font-size:0}nav button::first-letter{font-size:18px}nav h1,.who{display:none}}
</style>
<body>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal" id="modal"><div id="mbody"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, method='GET', body) {
  const r = await fetch(path, {method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { showLogin(); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail || j));
  return j;
}
const toast = m => alert(m);
let ME = null, TAB = new URLSearchParams(location.search).get('tab') || 'office', ACTIVE = null;
const TABS = [['office','🏢 Escritório'],['bots','🤖 Bots'],['creds','🔑 Acessos'],['flows','⚙️ Automações'],['jobs','📋 Tarefas'],['sched','⏰ Agendamentos'],['files','📁 Arquivos'],['admin','👥 Admin'],['cfg','🔧 Ajustes']];

function modal(html) { $('#mbody').innerHTML = html; $('#modal').classList.add('show'); }
function closeModal() { $('#modal').classList.remove('show'); $('#mbody').style.width = ''; }
function typed(el) {   // devolve o valor no mesmo tipo do original (número, sim/não, lista)
  const v = el.value, k = el.dataset.kind;
  if (k === 'number' && v.trim() !== '' && !isNaN(+v)) return +v;
  if (k === 'boolean') return /^(true|sim|s|1)$/i.test(v.trim());
  if (k === 'object') { try { return JSON.parse(v); } catch { return v; } }
  return v;
}
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function showLogin() {
  modal(`<h2>Entrar</h2><label>Usuário</label><input id="lu"><label>Senha</label><input id="lp" type="password">
  <p><button class="b" onclick="doLogin()">Entrar</button></p>`);
  $('#lp').addEventListener('keydown', e => e.key === 'Enter' && doLogin());
}
async function doLogin() {
  try { await api('/api/login','POST',{user:$('#lu').value,password:$('#lp').value}); closeModal(); boot(); }
  catch (e) { toast(e.message); }
}

async function boot() {
  const me = await fetch('/api/me').then(r => r.json());
  if (!me.user) return showLogin();
  ME = me;
  const u = me.user;
  $('#nav').innerHTML = '<h1>🤖 EmanusIA</h1>' + TABS.filter(([k]) => k !== 'admin' || u.role === 'admin')
    .map(([k,l]) => `<button data-t="${k}" class="${k===TAB?'on':''}" onclick="go('${k}')">${l}</button>`).join('')
    + `<div class="sp"></div><div class="who">${esc(u.name)} · ${esc(u.role)}</div>`
    + (me.auth_enabled ? '<button onclick="logout()">Sair</button>' : '');
  go(TAB);
  const open = new URLSearchParams(location.search).get('bot');
  if (open) { history.replaceState(null, '', '/'); openBot(open).catch(e => toast(e.message)); }
}
async function logout() { await api('/api/logout','POST'); location.reload(); }
function go(t) {
  TAB = t;
  document.querySelectorAll('nav button[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.querySelector('main').classList.toggle('full', t === 'office');
  (({creds: viewCreds, office: viewOffice, bots: viewBots, flows: viewFlows, jobs: viewJobs, sched: viewSched, files: viewFiles, admin: viewAdmin, cfg: viewCfg})[t] || viewOffice)();
}
const readonly = () => ME.user.role === 'viewer';

/* ---------- job polling (aprovações, progresso) ---------- */
async function follow(id, onUpdate) {
  ACTIVE = id;
  while (true) {
    const j = await api('/api/jobs/' + id);
    onUpdate(j);
    if (j.status === 'waiting_approval') askApproval(j);
    if (j.status === 'done' || j.status === 'error') return j;
    await new Promise(r => setTimeout(r, 800));
  }
}
let approvalShown = null;
function askApproval(j) {
  const key = j.id + JSON.stringify(j.pending);
  if (approvalShown === key) return; approvalShown = key;
  modal(`<h2>🤖 O robô precisa da sua permissão</h2><p style="font-size:17px">${esc(j.pending.text || j.pending.tool)}</p>
  <details><summary class="mut small">Detalhes técnicos</summary><pre>${esc(j.pending.tool)}\n${esc(JSON.stringify(j.pending.args, null, 2))}</pre></details>
  <div class="row" style="margin-top:12px"><button class="b big" onclick="answer('${j.id}',true)">✅ Pode sim</button>
  <button class="b bad big" onclick="answer('${j.id}',false)">✋ Não</button></div>`);
}
async function answer(id, ok) { closeModal(); approvalShown = null; await api(`/api/jobs/${id}/approve`, 'POST', {ok}); }

/* ---------- Automações ---------- */
async function viewFlows() {
  const wfs = await api('/api/workflows');
  $('#main').innerHTML = `<h2>Automações</h2><div id="rec"></div>
  ${readonly() ? '' : `<div class="card"><b>🎬 Gravar nova automação</b>
   <p class="mut small">Abre um navegador: use o site normalmente e o robô grava os passos. Senhas não são gravadas (viram variáveis de ambiente).</p>
   <div class="row"><input id="ru" placeholder="https://site-da-empresa.com" style="flex:2"><input id="rn" placeholder="nome-da-automacao" style="flex:1">
   <button class="b" onclick="startRec()">Gravar</button><button class="b sec" onclick="editFlow('')">Novo em YAML</button></div></div>`}
  <div class="grid">${wfs.map(w => `<div class="card"><b>${esc(w.name)}</b> <span class="tag">${w.steps} passos</span>
    <div class="mut small" style="margin:6px 0">${esc(w.description) || '—'}</div>
    <div class="row"><button class="b" ${w.allowed && !readonly() ? '' : 'disabled'} onclick='runFlow(${JSON.stringify(w.name)}, ${JSON.stringify(w.params)})'>▶ Executar</button>
    <button class="b sec" onclick='editFlow(${JSON.stringify(w.name)})'>${readonly() ? 'Ver' : 'Editar'}</button>
    <button class="b sec" ${readonly() ? 'disabled' : ''} onclick='schedFlow(${JSON.stringify(w.name)})'>⏰</button></div></div>`).join('') || '<p class="mut">Nenhuma automação ainda.</p>'}</div>`;
}
async function startRec() {
  try {
    const j = await api('/api/jobs/record', 'POST', {url: $('#ru').value, name: $('#rn').value});
    const r = $('#rec'); r.style.display = 'block';
    r.innerHTML = `🔴 Gravando <b>${esc(j.title)}</b> — use o navegador que abriu. <button class="b" onclick="stopRec('${j.id}')">Parar e salvar</button>`;
    follow(j.id, () => {}).then(x => { r.style.display = 'none'; toast(x.status === 'done' ? 'Automação salva!' : 'Erro: ' + x.result); viewFlows(); });
  } catch (e) { toast(e.message); }
}
async function stopRec(id) { await api(`/api/jobs/${id}/stop`, 'POST'); }
function runFlow(name, params) {
  const keys = Object.keys(params || {});
  modal(`<h2>Executar ${esc(name)}</h2>${keys.map(k => `<label>${esc(k)}</label><input data-p="${esc(k)}" value="${esc(params[k])}">`).join('')}
  <label>Ações de risco (enviar, pagar, gravar no SAP...)</label>
  <select id="risk"><option value="">Perguntar a cada ação</option><option value="true">Autorizar todas deste workflow</option><option value="false">Negar todas</option></select>
  <p><button class="b" onclick='doRun(${JSON.stringify(name)})'>Executar</button></p>`);
}
async function doRun(name) {
  const params = {}; document.querySelectorAll('[data-p]').forEach(i => params[i.dataset.p] = i.value);
  const r = $('#risk').value; closeModal();
  try { const j = await api('/api/jobs/workflow', 'POST', {name, params, approve_risky: r === '' ? null : r === 'true'}); go('jobs'); follow(j.id, () => {}); }
  catch (e) { toast(e.message); }
}
async function editFlow(name) {
  const y = name ? (await api('/api/workflows/' + name)).yaml : 'name: minha-automacao\ndescription: \nparams: {}\nsteps:\n  - tool: web_open\n    args: {url: "https://exemplo.com"}\n';
  modal(`<h2>${name ? esc(name) : 'Nova automação'}</h2>
  ${name ? '' : '<label>Nome do arquivo</label><input id="wn" placeholder="minha-automacao">'}
  <label>YAML (ferramentas: veja a aba Ajustes)</label><textarea id="wy" rows="16">${esc(y)}</textarea>
  <div class="row" style="margin-top:12px"><button class="b" ${readonly()?'disabled':''} onclick='saveFlow(${JSON.stringify(name)})'>Salvar</button>
  ${name && !readonly() ? `<button class="b bad" onclick='delFlow(${JSON.stringify(name)})'>Excluir</button>` : ''}</div>`);
}
async function saveFlow(name) {
  try { await api('/api/workflows/' + (name || $('#wn').value), 'PUT', {yaml: $('#wy').value}); closeModal(); viewFlows(); }
  catch (e) { toast(e.message); }
}
async function delFlow(name) { if (confirm('Excluir ' + name + '?')) { await api('/api/workflows/' + name, 'DELETE'); closeModal(); viewFlows(); } }

/* ---------- Agendamentos ---------- */
function schedFlow(name, kind = 'workflow') {
  modal(`<h2>Agendar ${kind === 'bot' ? '🤖 ' : ''}${esc(name)}</h2><label>Tipo</label>
  <select id="st" onchange="document.getElementById('sd').style.display=this.value=='d'?'block':'none'"><option value="e">A cada N minutos</option><option value="d">Diário em horário fixo</option></select>
  <label>Minutos (intervalo)</label><input id="sm" type="number" value="60" min="1">
  <div id="sd" style="display:none"><label>Horário</label><input id="sh" type="time" value="08:00">
  <label>Dias</label><div class="row">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map((d,i) => `<label style="margin:0"><input type="checkbox" class="day" value="${i}" ${i<5?'checked':''} style="width:auto"> ${d}</label>`).join('')}</div></div>
  ${ME.user.role === 'admin' ? '<label><input type="checkbox" id="su" style="width:auto"> Executar sem supervisão (autoriza ações de risco automaticamente)</label>' : '<p class="mut small">Ações de risco serão negadas nas execuções agendadas.</p>'}
  <p><button class="b" onclick='doSched(${JSON.stringify(name)}, ${JSON.stringify(kind)})'>Agendar</button></p>`);
}
async function doSched(name, kind = 'workflow') {
  const when = $('#st').value === 'e' ? {every_minutes: +$('#sm').value}
    : {daily_at: $('#sh').value, days: [...document.querySelectorAll('.day:checked')].map(c => +c.value)};
  try { await api('/api/schedules', 'POST', {[kind]: name, when, unattended: !!($('#su') && $('#su').checked)}); closeModal(); go('sched'); }
  catch (e) { toast(e.message); }
}
async function viewSched() {
  const s = await api('/api/schedules');
  $('#main').innerHTML = `<h2>Agendamentos</h2><div class="card"><table><tr><th>Automação</th><th>Quando</th><th>Próxima</th><th>Último</th><th>Dono</th><th></th></tr>
  ${s.map(i => `<tr><td>${i.bot ? '🤖 ' + esc(i.bot) : esc(i.workflow)}${i.unattended ? ' <span class="tag">sem supervisão</span>' : ''}</td>
  <td>${esc(i.when.every_minutes ? 'a cada ' + i.when.every_minutes + ' min' : i.when.daily_at)}</td><td>${esc(i.next_run.replace('T',' '))}</td>
  <td class="small">${esc(i.last_status || '—')}</td><td>${esc(i.owner)}</td>
  <td class="row"><button class="b sec" onclick="togSched('${i.id}',${!i.enabled})">${i.enabled ? 'Pausar' : 'Ativar'}</button><button class="b bad" onclick="delSched('${i.id}')">✕</button></td></tr>`).join('') || '<tr><td colspan=6 class="mut">Nada agendado. Agende pelas abas Bots ou Automações (⏰).</td></tr>'}</table></div>`;
}
async function togSched(id, en) { await api(`/api/schedules/${id}/toggle`, 'POST', {enabled: en}); viewSched(); }
async function delSched(id) { await api('/api/schedules/' + id, 'DELETE'); viewSched(); }

/* ---------- Tarefas ---------- */
async function viewJobs() {
  const js = await api('/api/jobs');
  $('#main').innerHTML = `<h2>Tarefas</h2><div class="card"><table><tr><th>Quando</th><th>Tipo</th><th>Título</th><th>Usuário</th><th>Status</th></tr>
  ${js.map(j => `<tr style="cursor:pointer" onclick="showJob('${j.id}')"><td class="small">${new Date(j.created*1000).toLocaleTimeString()}</td><td>${esc(j.kind)}</td><td>${esc(j.title)}</td><td>${esc(j.user)}</td><td><span class="tag ${j.status}">${esc(j.status)}</span></td></tr>`).join('') || '<tr><td class="mut">Sem tarefas nesta sessão.</td></tr>'}</table></div>`;
}
async function showJob(id) {
  const j = await api('/api/jobs/' + id);
  modal(`<h2>${esc(j.title)}</h2><span class="tag ${j.status}">${esc(j.status)}</span>
  <label>Passos</label><pre>${esc(j.events.map(e => e.kind === 'tool_call' ? '→ ' + e.name + ' ' + JSON.stringify(e.args) : e.kind === 'tool_result' ? '   ← ' + JSON.stringify(e.result).slice(0, 300) : e.kind + ' ' + JSON.stringify(e)).join('\n') || '—')}</pre>
  <label>Resultado</label><pre>${esc(typeof j.result === 'string' ? j.result : JSON.stringify(j.result, null, 2))}</pre>`);
}

/* ---------- Arquivos ---------- */
async function viewFiles() {
  const f = await api('/api/files');
  $('#main').innerHTML = `<h2>Arquivos gerados</h2><p class="mut small">Clique para ver dentro do sistema — planilhas (com fórmulas calculadas e gráficos), painéis, PDFs e imagens — sem abrir o Excel nem outro programa.</p>
  <div class="card"><table><tr><th>Arquivo</th><th>Tamanho</th><th>Modificado</th><th></th></tr>
  ${f.map(x => `<tr><td><a href="/view?path=${encodeURIComponent(x.path)}" style="color:var(--acc)">${fileIcon(x.path)} ${esc(x.path)}</a></td>
  <td>${(x.size/1024).toFixed(1)} KB</td><td class="small">${new Date(x.mtime*1000).toLocaleString('pt-BR')}</td>
  <td class="row"><a class="b sec" href="/view?path=${encodeURIComponent(x.path)}">👁 Ver</a>
  <a class="b sec" href="/files/${x.path.split('/').map(encodeURIComponent).join('/')}?download=1" title="Baixar">⬇</a></td></tr>`).join('') || '<tr><td class="mut">Vazio.</td></tr>'}</table></div>`;
}
function fileIcon(p) {
  const e = p.split('.').pop().toLowerCase();
  return {xlsx: '📗', xlsm: '📗', csv: '📗', html: '📊', htm: '📊', pdf: '📕', xml: '🧾', json: '🧾', png: '🖼', jpg: '🖼', zip: '🗜'}[e] || '📄';
}

/* ---------- Admin ---------- */
async function viewAdmin() {
  const [us, au] = await Promise.all([api('/api/users'), api('/api/audit')]);
  $('#main').innerHTML = `<h2>Usuários e auditoria</h2>
  <div class="card"><b>Usuários</b> <span class="mut small">${ME.auth_enabled ? '' : '— nenhum usuário cadastrado: modo local sem login. Crie o primeiro (admin) para ativar o login.'}</span>
  <table>${us.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td class="small">${u.reviewer || u.role === 'admin' ? '🎓 padrinho · ' : ''}${u.tools ? 'ferramentas: ' + esc(u.tools.join(', ')) : 'todas as ferramentas'}</td>
  <td><button class="b bad" onclick="delUser('${esc(u.name)}')">✕</button></td></tr>`).join('')}</table>
  <div class="row" style="margin-top:10px"><input id="nu" placeholder="nome"><input id="np" type="password" placeholder="senha (8+)">
  <select id="nr"><option>operator</option><option>admin</option><option>viewer</option></select>
  <input id="nt" placeholder="ferramentas permitidas (opcional, separadas por vírgula)">
  <label style="margin:0;white-space:nowrap"><input type="checkbox" id="nrv" style="width:auto"> padrinho (revisa bots)</label><button class="b" onclick="addUser()">Criar</button></div></div>
  <div class="card"><b>Auditoria (últimos 200)</b><table>${au.map(a => `<tr><td class="small">${esc(a.ts)}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td>
  <td class="small">${esc(a.tool || a.workflow || a.task || a.name || '')}${a.ok === false ? ' ❌ ' + esc(a.error) : ''}</td></tr>`).join('')}</table></div>`;
}
async function addUser() {
  const t = $('#nt').value.split(',').map(s => s.trim()).filter(Boolean);
  try { await api('/api/users', 'POST', {name: $('#nu').value, password: $('#np').value, role: $('#nr').value, tools: t.length ? t : null, reviewer: $('#nrv').checked});
    toast('Usuário criado. O login passa a ser exigido.'); location.reload(); } catch (e) { toast(e.message); }
}
async function delUser(n) { if (confirm('Remover ' + n + '?')) { try { await api('/api/users/' + n, 'DELETE'); viewAdmin(); } catch (e) { toast(e.message); } } }

/* ---------- Escritório ---------- */

/* --- ensinar mostrando --- */
async function teach() {
  const name = $('#tn').value.trim(), url = $('#tu').value.trim();
  if (!name) return toast('Dê um nome para o robô.');
  if (!url) return toast('Diga em qual site ele vai trabalhar.');
  try {
    const j = await api('/api/teach', 'POST', {name, url: /^https?:|^file:/.test(url) ? url : 'https://' + url, team: $('#tt').value || 'Geral', credential: $('#tc').value});
    const bar = document.createElement('div'); bar.className = 'recbar';
    bar.innerHTML = `<span style="font-size:22px">🔴</span><div><b>Estou aprendendo com você</b><div class="small" style="opacity:.8">Faça a tarefa na janela do navegador que abriu. Senhas não são gravadas.</div></div>
      <button class="b big" style="background:#22c7a9" id="tdone">✅ Terminei</button>`;
    document.body.append(bar);
    $('#tdone').onclick = async () => { $('#tdone').disabled = true; $('#tdone').textContent = 'Salvando...'; await api(`/api/jobs/${j.id}/stop`, 'POST'); };
    const r = await follow(j.id, () => {});
    bar.remove();
    if (r.status === 'error') return toast(r.plain_error || r.result);
    toast(`Pronto! O robô "${r.result.name}" aprendeu ${r.result.code.steps.length} passos. Confira se está tudo certo.`);
    viewBots(); openBot(r.result.id);
  } catch (e) { toast(e.message); }
}

/* --- página do robô: passos em português, ensaio, revisão --- */
let BOT = null;
async function openBot(id) {
  const [b, d] = await Promise.all([api('/api/bots/' + id), api(`/api/bots/${id}/steps`)]);
  BOT = {b, d};
  const nx = d.next, reh = d.rehearsal_current ? d.rehearsal : null, rv = d.review || {};
  const stages = [['Ensinado', true], ['Conferido', nx.step !== 'validate'], ['Ensaio', !['validate', 'rehearse'].includes(nx.step) || !d.needs_rehearsal],
    ['Revisão', ['activate', 'done'].includes(nx.step)], ['Trabalhando', nx.step === 'done']];
  const cur = stages.findIndex(s => !s[1]);
  const shot = {}; (reh ? reh.steps : []).forEach(s => { shot[s.path] = s; });
  const reviewing = !b.can_edit && ME.user.reviewer;
  modal(`<h2>${esc(b.name)}</h2><div class="mut small">${b.role === 'boss' ? '👔 chefe' : '🤖 funcionário'} · ${esc(b.team)} · de ${esc(b.owner)}</div>
  <div class="track">${stages.map((s, i) => `<span class="${s[1] ? 'ok' : i === cur ? 'now' : ''}">${s[1] ? '✓ ' : ''}${s[0]}</span>`).join('')}</div>
  ${d.plain_errors.length ? `<div class="note bad"><b>O robô precisa de ajuste:</b>${d.plain_errors.map(e => `<div>• ${esc(e)}</div>`).join('')}</div>` : ''}
  ${rv.status === 'changes' ? `<div class="note warn">🎓 <b>${esc(rv.by)}</b> pediu ajustes: “${esc(rv.note)}”</div>` : ''}
  ${rv.status === 'pending' && reviewing ? `<div class="note warn">🎓 <b>${esc(b.owner)}</b> pediu sua revisão${rv.note ? ': “' + esc(rv.note) + '”' : ''}. Confira os passos e o ensaio abaixo.</div>` : ''}
  ${reh ? `<div class="note ${reh.ok ? 'ok' : 'bad'}">🎭 Ensaio de ${esc(reh.at)}: ${reh.ok ? '<b>deu tudo certo!</b>' : '<b>parou num passo.</b> ' + esc(reh.error || '')}</div>` : ''}
  <b>O que o robô faz</b><ol class="steps">${d.steps.map(s => stepHtml(s, shot[s.path], b.can_edit, reh)).join('')}</ol>
  ${b.can_edit ? `<button class="b sec" onclick="openAddStep()">+ Adicionar passo</button>` : ''}
  ${d.params.length ? `<p><b>Informações que podem mudar a cada vez</b></p>${d.params.map((p, i) => `<label>${esc(p.label)}</label>
    <input data-param="${esc(p.name)}" data-kind="${typeof p.value}" value="${esc(typeof p.value === 'object' ? JSON.stringify(p.value) : p.value)}" ${b.can_edit ? '' : 'disabled'}>`).join('')}
    ${b.can_edit ? '<p><button class="b sec" onclick="saveParams()">Salvar informações</button></p>' : ''}` : ''}
  <div class="row" style="margin-top:16px">${reviewing ? `<button class="b big" onclick="decide(true)">✅ Aprovar e colocar para trabalhar</button>
    <button class="b bad" onclick="decide(false)">Pedir ajustes</button>` : b.can_edit ? nextButton(nx) : ''}
    ${b.can_edit && b.status !== 'draft' ? `<button class="b sec" onclick='runBot(${JSON.stringify(b.id)})'>▶ Executar agora</button>` : ''}</div>
  ${b.can_edit ? `<p class="small" style="margin-top:14px"><a href="/builder?bot=${encodeURIComponent(b.id)}" style="color:var(--acc)">🧩 Editar no construtor</a> ·
    <a href="#" onclick='editBot(${JSON.stringify(b.id)});return false' style="color:var(--mut)">Modo avançado (código)</a> ·
    <a href="#" onclick='delBot(${JSON.stringify(b.id)});return false' style="color:var(--bad)">Demitir robô</a></p>` : ''}`);
  $('#mbody').style.width = 'min(760px,94vw)';
}
function stepHtml(s, r, edit, reh) {
  if (s.header) return `<li class="st" style="margin-left:${s.depth * 22}px;background:none;border-style:dashed"><div class="tx mut">${esc(s.text)}</div></li>`;
  const top = !s.path.includes('.'), bad = r && !r.ok;
  return `<li class="st ${bad ? 'bad' : ''}" style="margin-left:${s.depth * 22}px"><div class="num">${r ? (r.ok ? '✓' : '✖') : esc(s.path.split('.').pop())}</div>
  <div class="tx"><div>${s.icon} ${esc(s.text)}</div>
  ${bad ? `<div class="small" style="color:var(--bad);margin-top:4px">${esc(r.error)}</div>
    ${s.fixable && edit ? `<button class="b" style="margin-top:6px" onclick="fixStep('${s.path}')">👉 Mostrar onde fica</button>` : ''}` : ''}
  ${r && r.shot ? `<img src="/api/bots/${encodeURIComponent(BOT.b.id)}/shots/${r.shot}?t=${encodeURIComponent(reh.at)}" onclick="window.open(this.src)" alt="print do passo">` : ''}</div>
  ${edit && top ? `<div class="acts"><button title="Editar" onclick="editStep('${s.path}')">✏️</button><button title="Subir" onclick="moveStep('${s.path}',-1)">↑</button>
    <button title="Descer" onclick="moveStep('${s.path}',1)">↓</button><button title="Apagar" onclick="delStep('${s.path}')">🗑</button></div>` : ''}</li>`;
}
function nextButton(nx) {
  const act = {validate: 'checkBot()', rehearse: 'rehearse()', submit_review: 'askReview()', activate: 'goLive()'}[nx.step];
  return act ? `<button class="b big" onclick="${act}">${NEXT_ICON[nx.step]} ${esc(nx.text)}</button>` : `<span class="note ${nx.step === 'done' ? 'ok' : 'warn'}">${NEXT_ICON[nx.step]} ${esc(nx.text)}</span>`;
}
async function saveCode(code) { await api('/api/bots/' + BOT.b.id, 'PUT', {code}); await api(`/api/bots/${BOT.b.id}/validate`, 'POST'); openBot(BOT.b.id); }
function topSteps() { return JSON.parse(JSON.stringify(BOT.b.code.steps || [])); }
async function moveStep(p, dir) { const st = topSteps(), i = +p - 1, k = i + dir; if (k < 0 || k >= st.length) return; [st[i], st[k]] = [st[k], st[i]]; await saveCode({...BOT.b.code, steps: st}); }
async function delStep(p) { if (!confirm('Apagar este passo?')) return; const st = topSteps(); st.splice(+p - 1, 1); await saveCode({...BOT.b.code, steps: st}); }
function editStep(p) {
  const st = topSteps(), s = st[+p - 1], a = s.args || {}, F = BOT.d.fields;
  const simple = Object.entries(a).filter(([k, v]) => k !== 'selector' && (typeof v !== 'object' || v === null));
  const complex = Object.entries(a).filter(([k, v]) => typeof v === 'object' && v !== null);
  modal(`<h2>✏️ Editar passo ${esc(p)}</h2>
  ${'label' in s || a.selector ? `<label>Nome do botão/campo (como aparece na tela)</label><input id="sl" value="${esc(s.label || '')}">` : ''}
  ${simple.map(([k, v]) => `<label>${esc(F[k] || k)}</label><input data-arg="${esc(k)}" value="${esc(v)}">`).join('')}
  <details style="margin-top:10px"><summary class="mut small">Avançado</summary>
   ${a.selector !== undefined ? `<label>Onde fica (seletor)</label><input data-arg="selector" value="${esc(a.selector)}">` : ''}
   ${complex.map(([k, v]) => `<label>${esc(F[k] || k)}</label><textarea data-json="${esc(k)}" rows="3">${esc(JSON.stringify(v))}</textarea>`).join('')}</details>
  <div class="row" style="margin-top:12px"><button class="b" onclick="saveStep('${p}')">Salvar</button><button class="b sec" onclick="openBot(BOT.b.id)">Cancelar</button></div>`);
}
async function saveStep(p) {
  const st = topSteps(), s = st[+p - 1]; s.args = s.args || {};
  document.querySelectorAll('[data-arg]').forEach(i => { const v = i.value; s.args[i.dataset.arg] = /^-?\d+(\.\d+)?$/.test(v) && typeof s.args[i.dataset.arg] === 'number' ? +v : v; });
  try { document.querySelectorAll('[data-json]').forEach(i => { s.args[i.dataset.json] = JSON.parse(i.value); }); } catch { return toast('Um campo avançado ficou mal escrito.'); }
  if ($('#sl')) { if ($('#sl').value.trim()) s.label = $('#sl').value.trim(); else delete s.label; }
  await saveCode({...BOT.b.code, steps: st});
}

      <button class="b big" style="background:#22c7a9" id="tdone">✅ Terminei</button>`;

  } catch (e) { toast(e.message); }
  openBot(BOT.b.id);
}

  try { const j = await api(`/api/bots/${BOT.b.id}/fix`, 'POST', {path}); const r = await follow(j.id, () => {});
    if (r.status === 'error') toast(r.plain_error || r.result); else toast(`Aprendi! Agora o passo é: ${r.result.text}. Faça um novo ensaio.`); } catch (e) { toast(e.message); }
  openBot(BOT.b.id);
}
async function askReview() {
  const note = prompt('Quer deixar um recado para o padrinho? (opcional)') ?? null; if (note === null) return;
  try { await api(`/api/bots/${BOT.b.id}/review/submit`, 'POST', {note}); toast('Enviado! O padrinho vai revisar e colocar para trabalhar.'); } catch (e) { toast(e.message); }
  openBot(BOT.b.id); viewBots();
}
async function decide(ok) {
  const note = ok ? '' : prompt('O que precisa ser ajustado?'); if (!ok && !note) return;
  try { await api(`/api/bots/${BOT.b.id}/review`, 'POST', {approve: ok, note}); toast(ok ? 'Aprovado! O robô já está trabalhando.' : 'Pedido de ajuste enviado.'); closeModal(); viewBots(); }
  catch (e) { toast(e.message); }
}
async function goLive() { try { await api(`/api/bots/${BOT.b.id}/active`, 'POST', {active: true}); toast('O robô começou a trabalhar! 🎉'); closeModal(); viewBots(); } catch (e) { toast(e.message); } }

function newBot() { botEditor(null, 'params: {}\nsteps:\n  - log: "olá, sou um bot novo"\n'); }
async function editBot(id) { const b = await api('/api/bots/' + id); botEditor(b, b.yaml, b.validation); }
function report(r) {
  if (!r) return '';
  return `<div class="small" style="margin-top:8px">${r.ok ? '<span style="color:var(--ok)">✔ Código válido</span>' : '<span style="color:var(--bad)">✖ Código com erros</span>'}
  ${(r.errors || []).map(e => `<div style="color:var(--bad)">• ${esc(e)}</div>`).join('')}
  ${(r.warnings || []).map(e => `<div style="color:var(--warn)">• ${esc(e)}</div>`).join('')}
  ${(r.risky_tools || []).length ? `<div class="mut">Ações que vão pedir autorização: ${esc(r.risky_tools.join(', '))}</div>` : ''}</div>`;
}
function botEditor(b, yaml, rep, note = '', origin = 'manual') {
  const n = b ? b.name : ($('#bn') ? $('#bn').value : ''), t = b ? b.team : ($('#bt') ? $('#bt').value : ''), r = b ? b.role : ($('#br') ? $('#br').value : 'worker');
  const d = b ? b.description : '';
  modal(`<h2>${b ? 'Código de ' + esc(b.name) : 'Novo bot'}</h2>${note ? `<p class="mut small">${esc(note)}</p>` : ''}
  <div class="row"><input id="en" value="${esc(n)}" placeholder="Nome" ${b ? 'disabled' : ''} style="flex:2"><input id="et" value="${esc(t)}" placeholder="Time" style="flex:1">
  <select id="er" style="flex:0 0 130px"><option value="worker" ${r === 'worker' ? 'selected' : ''}>Funcionário</option><option value="boss" ${r === 'boss' ? 'selected' : ''}>Chefe</option></select></div>
  <label>Descrição</label><input id="ed" value="${esc(d)}">
  <label>Código (YAML) — validado automaticamente enquanto você edita</label><textarea id="ey" rows="16">${esc(yaml)}</textarea>
  <div id="erep">${report(rep)}</div>
  <div class="row" style="margin-top:12px"><button class="b" onclick='saveBot(${JSON.stringify(b ? b.id : null)}, ${JSON.stringify(origin)})'>Salvar e validar</button>
  ${b ? `<button class="b bad" onclick='delBot(${JSON.stringify(b.id)})'>Excluir bot</button>` : ''}
  <span class="mut small">Salvar volta o bot para rascunho até passar na validação.</span></div>`);
  let tm; $('#ey').addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(async () => { $('#erep').innerHTML = report(await api('/api/validate', 'POST', {yaml: $('#ey').value})); }, 500); });
}
async function saveBot(id, origin) {
  const body = {team: $('#et').value, role: $('#er').value, description: $('#ed').value, yaml: $('#ey').value};
  try {
    const b = id ? await api('/api/bots/' + id, 'PUT', body) : await api('/api/bots', 'POST', {...body, name: $('#en').value, origin});
    const rep = await api(`/api/bots/${b.id}/validate`, 'POST');
    if (rep.ok) { closeModal(); toast(`Bot "${b.name}" validado! Agora é só ativar.`); viewBots(); }
    else { $('#erep').innerHTML = report(rep); if (!id) { closeModal(); viewBots(); toast('Bot salvo como rascunho: corrija os erros em "Código".'); } }
  } catch (e) { toast(e.message); }
}
async function activeBot(id, on) { try { await api(`/api/bots/${id}/active`, 'POST', {active: on}); viewBots(); } catch (e) { toast(e.message); } }
async function delBot(id) { if (confirm('Demitir este robô?')) { await api('/api/bots/' + id, 'DELETE'); closeModal(); viewBots(); } }
async function runBot(id) {
  const b = await api('/api/bots/' + id);
  modal(`<h2>▶ ${esc(b.name)}</h2>${b.params.length ? '<p class="mut">Confira as informações desta vez:</p>' : '<p>Tudo pronto para começar.</p>'}
  ${b.params.map(p => `<label>${esc(p.label)}</label><input data-run="${esc(p.name)}" data-kind="${typeof p.value}" value="${esc(typeof p.value === 'object' ? JSON.stringify(p.value) : p.value)}">`).join('')}
  <label>Se o robô precisar fazer algo importante (enviar, aprovar, apagar)</label>
  <select id="risk"><option value="">Me pergunte na hora</option><option value="true">Pode fazer sem perguntar, desta vez</option><option value="false">Não faça nada importante</option></select>
  <p><button class="b big" onclick='doRunBot(${JSON.stringify(id)})'>▶ Começar</button></p>`);
}
async function doRunBot(id) {
  const params = {}; document.querySelectorAll('[data-run]').forEach(i => { params[i.dataset.run] = typed(i); });
  const r = $('#risk').value; closeModal();
  try { const j = await api(`/api/bots/${id}/run`, 'POST', {params, approve_risky: r === '' ? null : r === 'true'}); go('office');
    follow(j.id, () => {}).then(x => { if (x.status === 'error') toast('O robô parou: ' + (x.plain_error || x.result)); }); }
  catch (e) { toast(e.message); }
}

/* ---------- Acessos (cofre) ---------- */
const KIND = {web: '🌐 Site', sap: '🟦 SAP', desktop: '🖥 Programa', api: '🔌 API', other: '🔐 Outro'};
async function viewCreds() {
  const cs = await api('/api/credentials');
  $('#main').innerHTML = `<h2>Meus acessos</h2>
  <div class="card small mut">Cadastre aqui o <b>seu</b> login de cada sistema. Os bots usam só o <b>nome</b> do acesso
  (ex.: <code>web_login: portal-fornecedor</code>) e, ao rodar, pegam o login de quem está executando — cada pessoa da equipe usa o próprio usuário.
  As senhas ficam criptografadas neste computador e nunca aparecem na tela nem nos registros.</div>
  ${readonly() ? '' : '<p><button class="b" onclick="editCred()">+ Novo acesso</button></p>'}
  <div class="card"><table><tr><th>Nome</th><th>Sistema</th><th>Usuário</th><th>Endereço</th><th>Atualizado</th><th></th></tr>
  ${cs.map(c => `<tr><td><code>${esc(c.name)}</code>${c.shared ? ' <span class="tag">compartilhado</span>' : ''}<div class="small mut">${esc(c.label)}</div></td>
   <td>${KIND[c.kind] || esc(c.kind)}</td><td>${esc(c.username)} <span class="mut">••••••</span></td><td class="small">${esc(c.url)}</td>
   <td class="small mut">${esc(c.updated)}</td><td class="row">${readonly() || (c.shared && ME.user.role !== 'admin') ? '' :
   `<button class="b sec" onclick='editCred(${JSON.stringify(c)})'>Editar</button><button class="b bad" onclick='delCred(${JSON.stringify(c.name)}, ${c.shared})'>✕</button>`}</td></tr>`).join('')
   || '<tr><td colspan=6 class="mut">Nenhum acesso cadastrado.</td></tr>'}</table></div>`;
}
function editCred(c) {
  c = c || {name: '', label: '', kind: 'web', url: '', username: '', extra: {}, shared: false};
  const x = c.extra || {};
  modal(`<h2>${c.name ? 'Editar acesso' : 'Novo acesso'}</h2>
  <div class="row"><div style="flex:1"><label>Nome (usado pelos bots)</label><input id="cn" value="${esc(c.name)}" placeholder="portal-fornecedor" ${c.name ? 'disabled' : ''}></div>
  <div style="flex:1"><label>Tipo</label><select id="ck">${Object.entries(KIND).map(([k, v]) => `<option value="${k}" ${k === c.kind ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
  <label>Descrição</label><input id="cl" value="${esc(c.label)}" placeholder="Portal do fornecedor X">
  <label>Endereço (URL / servidor)</label><input id="cu" value="${esc(c.url)}" placeholder="https://portal.fornecedor.com/login">
  <div class="row"><div style="flex:1"><label>Usuário</label><input id="cus" value="${esc(c.username)}" autocomplete="off"></div>
  <div style="flex:1"><label>Senha ${c.name ? '(vazio = manter)' : ''}</label><input id="cp" type="password" autocomplete="new-password"></div></div>
  <details style="margin-top:10px"><summary class="small mut">Avançado (site com login diferente, SAP)</summary>
   <div class="row"><input id="xu" value="${esc(x.user_selector || '')}" placeholder="seletor do usuário"><input id="xp" value="${esc(x.pass_selector || '')}" placeholder="seletor da senha"></div>
   <div class="row" style="margin-top:6px"><input id="xs" value="${esc(x.submit_selector || '')}" placeholder="seletor do botão entrar"><input id="xok" value="${esc(x.success_selector || '')}" placeholder="seletor que aparece após logar"></div>
   <div class="row" style="margin-top:6px"><input id="xse" value="${esc(x.session || '')}" placeholder="salvar sessão como (reusa cookies/MFA)"><input id="xc" value="${esc(x.client || '')}" placeholder="SAP: mandante"><input id="xl" value="${esc(x.language || '')}" placeholder="SAP: idioma (PT)"></div></details>
  ${ME.user.role === 'admin' ? `<label><input type="checkbox" id="csh" style="width:auto" ${c.shared ? 'checked' : ''} ${c.name ? 'disabled' : ''}> Compartilhado (conta de serviço para quem não tiver acesso próprio)</label>` : ''}
  <p><button class="b" onclick="saveCred(${c.name ? 'true' : 'false'})">Salvar</button></p>`);
}
async function saveCred(editing) {
  const extra = {user_selector: $('#xu').value, pass_selector: $('#xp').value, submit_selector: $('#xs').value, success_selector: $('#xok').value,
    session: $('#xse').value, client: $('#xc').value, language: $('#xl').value};
  const pw = $('#cp').value;
  try { await api('/api/credentials/' + encodeURIComponent($('#cn').value.trim()), 'PUT', {label: $('#cl').value, kind: $('#ck').value, url: $('#cu').value,
      username: $('#cus').value, password: pw ? pw : (editing ? null : ''), extra, shared: !!($('#csh') && $('#csh').checked)});
    closeModal(); viewCreds(); } catch (e) { toast(e.message); }
}
async function delCred(n, shared) { if (confirm('Remover o acesso ' + n + '?')) { await api(`/api/credentials/${encodeURIComponent(n)}?shared=${shared}`, 'DELETE'); viewCreds(); } }

/* ---------- Ajustes ---------- */
async function viewCfg() {
  const [c, tools] = await Promise.all([api('/api/config'), api('/api/tools')]);
  const S = c.settings, adm = ME.user.role === 'admin', dis = adm ? '' : 'disabled';
  $('#main').innerHTML = `<h2>Ajustes</h2>
  <div class="card"><b>Empresa</b><label>Nome (aparece no escritório)</label><input id="cc" value="${esc(S.company_name)}" ${dis}></div>
  <div class="card"><b>📂 Pastas liberadas</b><p class="small mut">Os robôs sempre podem usar a pasta de trabalho (<code>${esc(c.workspace)}</code>).
  Libere aqui outras pastas, uma por linha (ex.: <code>C:\Notas Fiscais</code> ou <code>\\servidor\financeiro</code>). Nenhuma outra pasta do computador é acessada.</p>
  <textarea id="af" rows="3" ${dis} placeholder="C:\Notas Fiscais">${esc((S.allowed_folders || []).join('\n'))}</textarea></div>
  <div class="card"><b>E-mail</b>
  <label>Provedor</label><select id="ep" ${dis} onchange="document.getElementById('smtp').style.display=this.value==='smtp'?'block':'none'">
    <option value="outlook" ${S.email_provider === 'outlook' ? 'selected' : ''}>Outlook instalado (padrão — usa a conta já logada no Windows)</option>
    <option value="smtp" ${S.email_provider === 'smtp' ? 'selected' : ''}>SMTP / IMAP</option></select>
  <div id="smtp" style="display:${S.email_provider === 'smtp' ? 'block' : 'none'}">
    <div class="row"><div style="flex:3"><label>Servidor SMTP</label><input id="sh2" value="${esc(S.smtp_host)}" placeholder="smtp.office365.com" ${dis}></div>
    <div style="flex:1"><label>Porta</label><input id="sp" type="number" value="${esc(S.smtp_port)}" ${dis}></div></div>
    <div class="row"><div style="flex:1"><label>Usuário</label><input id="su2" value="${esc(S.smtp_user)}" ${dis}></div>
    <div style="flex:1"><label>Remetente (opcional)</label><input id="sf" value="${esc(S.smtp_from)}" ${dis}></div></div>
    <div class="row"><div style="flex:1"><label>Servidor IMAP (leitura)</label><input id="ih" value="${esc(S.imap_host)}" placeholder="outlook.office365.com" ${dis}></div>
    <div style="flex:1"><label>Usuário IMAP (vazio = mesmo do SMTP)</label><input id="iu" value="${esc(S.imap_user)}" ${dis}></div></div>
    <p class="mut small">🔒 Senhas não ficam salvas no sistema: defina as variáveis de ambiente <code>EMAIL_SMTP_PASS</code> e <code>EMAIL_IMAP_PASS</code> no Windows.</p></div></div>
  <div class="card"><b>🩺 Diagnóstico</b><p class="small mut">Confere Python, pacotes, navegador dos robôs, cofre e integrações do Windows (Outlook, Excel, SAP).</p>
  <button class="b sec" ${dis} onclick="runDoctor()">Rodar diagnóstico</button><div id="doc"></div></div>
  <p><button class="b" ${dis} onclick="saveCfg()">Salvar ajustes</button> <span class="mut small">${adm ? '' : 'Somente admin altera ajustes.'}</span></p>
  <div class="card"><b>Ferramentas disponíveis</b> <span class="mut small">(⚠️ = pede autorização)</span>
  <table>${tools.map(t => `<tr style="${t.allowed ? '' : 'opacity:.4'}"><td><code>${esc(t.name)}</code> ${t.risky ? '⚠️' : ''}</td><td class="small mut">${esc(t.group)}</td><td class="small">${esc(t.description)}<br><span class="mut">args: ${esc(t.args.join(', ') || '—')}</span></td></tr>`).join('')}</table></div>`;
}
async function runDoctor() {
  $('#doc').innerHTML = '<p class="mut">⏳ Verificando (até 1 minuto)...</p>';
  try { const r = await api('/api/doctor'); const ic = {ok: '✅', aviso: '⚠️', erro: '❌'};
    $('#doc').innerHTML = `<table>${r.items.map(i => `<tr><td>${ic[i.level]}</td><td><b>${esc(i.name)}</b><div class="small mut">${esc(i.detail)}</div>
      ${i.fix && i.level !== 'ok' ? `<div class="small">→ ${esc(i.fix)}</div>` : ''}</td></tr>`).join('')}</table>
      ${r.errors.length ? `<p class="small"><b>Últimos erros:</b></p><pre>${esc(r.errors.join('\n'))}</pre>` : ''}<p class="small mut">Registro: ${esc(r.log)}</p>`;
  } catch (e) { $('#doc').innerHTML = `<p style="color:var(--bad)">${esc(e.message)}</p>`; }
}
async function saveCfg() {
  try { await api('/api/settings', 'POST', {company_name: $('#cc').value, email_provider: $('#ep').value,
      smtp_host: $('#sh2').value, smtp_port: +$('#sp').value || 587, smtp_user: $('#su2').value, smtp_from: $('#sf').value, imap_host: $('#ih').value,
      imap_user: $('#iu').value, allowed_folders: $('#af').value.split('\n').map(x => x.trim()).filter(Boolean)});
    toast('Salvo.'); } catch (e) { toast(e.message); }
}

boot();
</script>
</html>
