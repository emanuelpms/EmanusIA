<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escritório EmanusIA</title>
<style>
:root{--bg:#14131c;--panel:rgba(22,24,36,.92);--panel2:#1e2132;--fg:#eef1f7;--mut:#9aa3b8;--acc:#5b8cff;--gold:#ffcf5a;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden}
#wrap{position:absolute;top:56px;left:0;right:0;bottom:0;overflow:auto;cursor:grab;background:radial-gradient(ellipse at center,#1d1c29 0,#111018 75%)}
#wrap:active{cursor:grabbing}body.side #wrap{right:300px}
canvas{display:block;image-rendering:pixelated;margin:auto}
.glass{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:16px;padding:0 14px;z-index:5;border-width:0 0 1px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#5b8cff,#8b5cf6);display:grid;place-items:center;font-weight:800;flex:none}
.brand b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lvl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#1b1400;background:var(--gold);border-radius:99px;padding:2px 9px;flex:none}
.stats{display:flex;gap:6px;margin-left:auto;overflow:hidden}.stat{padding:4px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.stat small{display:block;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}.stat b{font-size:15px}.stat .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.tools{display:flex;gap:6px;align-items:center}#clock{color:var(--mut);font-variant-numeric:tabular-nums;margin-right:4px}
button{font:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
button:hover{border-color:rgba(255,255,255,.25)}button.go{background:var(--ok);border-color:var(--ok);color:#052e1c;font-weight:600}button:disabled{opacity:.45;cursor:default}
aside{position:fixed;top:56px;right:0;bottom:0;width:300px;border-width:0 0 0 1px;display:none;flex-direction:column;z-index:4}body.side aside{display:flex}
aside h4{margin:0;padding:12px 14px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
#team{overflow:auto;flex:1;padding:0 8px 8px}.tm{margin:6px 6px 2px;font-weight:600;font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.bot{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer}.bot:hover,.bot.sel{background:rgba(255,255,255,.06)}
.av{width:22px;height:22px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#0b0b12}
.bot .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{font-size:10.5px;border-radius:99px;padding:1px 7px;white-space:nowrap}
#info{margin:8px;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:none}
#info h3{margin:0;font-size:15px}.meta{color:var(--mut);font-size:12px}.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 2px}.bar i{display:block;height:100%;background:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin-top:8px}.kv span{color:var(--mut)}.row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
#feed{position:fixed;left:12px;bottom:12px;width:min(400px,calc(100% - 24px));border-radius:12px;padding:8px 10px;z-index:4;max-height:170px;overflow:hidden}
#feed:empty{display:none}#feed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}#feed .t{color:var(--mut);font-variant-numeric:tabular-nums;margin-right:6px}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);display:none;padding:16px 20px;border-radius:12px;z-index:9}
#tip{position:fixed;pointer-events:none;padding:4px 8px;border-radius:6px;font-size:12px;display:none;z-index:9}
@media(max-width:900px){.stat.opt{display:none}}@media(max-width:700px){body.side #wrap{right:0;bottom:45%}#clock{display:none}aside{width:100%;top:auto;height:45%;border-width:1px 0 0}#feed{display:none}.stats{display:none}}
</style>
<body class="side">
<header class="glass"><div class="brand"><div class="logo">E</div><b id="company">EmanusIA S.A.</b><span class="lvl" id="level">Garagem</span></div>
  <div class="stats"><div class="stat"><small>Bots</small><b id="nb">0</b></div>
    <div class="stat"><small><span class="dot" style="background:var(--ok)"></span>Trabalhando</small><b id="nw">0</b></div>
    <div class="stat opt"><small><span class="dot" style="background:var(--warn)"></span>Aguardando</small><b id="na">0</b></div>
    <div class="stat opt"><small>Execuções hoje</small><b id="nr">0</b></div>
    <div class="stat opt"><small>Sucesso</small><b id="ns">—</b></div></div>
  <div class="tools"><span id="clock"></span><button title="Diminuir" onclick="zoom(-1)">−</button><button title="Aumentar" onclick="zoom(1)">+</button>
    <button title="Equipe" onclick="document.body.classList.toggle('side');setTimeout(()=>{resize.user=false;buildLayout(BOTS);snapAll()},50)">☰</button></div></header>
<div id="wrap"><canvas id="cv"></canvas></div>
<aside class="glass"><div id="info"></div><h4>Equipe</h4><div id="team"></div></aside>
<div class="glass" id="feed"></div>
<div class="glass" id="msg"></div>
<div class="glass" id="tip"></div>
<script>
'use strict';
const T = 16, cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let SCALE = 3, W = 20, H = 14, tiles = [], solid = new Set(), furn = [], rooms = [], L = null;
let PER_ROW = 1, chars = new Map(), BOTS = [], cursor = 0, layoutSig = '', staticBase = null, staticTop = null;
const now = () => performance.now();
const rnd = a => a[Math.floor(Math.random() * a.length)];
function hash(s) { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(f < 1 ? v * f : v + (255 - v) * (f - 1))))); return '#' + c.map(v => v.toString(16).padStart(2, '0')).join(''); }
const key = (x, y) => x + ',' + y;

/* ============================== LAYOUT (cresce com a empresa) ============================== */
function level(n) { return n < 3 ? ['Garagem', 1] : n < 6 ? ['Startup', 2] : n < 13 ? ['Escritório', 3] : n < 31 ? ['Empresa', 4] : ['Corporação', 5]; }
function buildLayout(bots) {
  const staff = bots.filter(b => b.status !== 'draft'), drafts = bots.filter(b => b.status === 'draft');
  const teams = [...new Set(staff.map(b => b.team))].sort((a, b) => a === 'Geral' ? -1 : b === 'Geral' ? 1 : a.localeCompare(b));
  const lv = level(staff.length)[1];
  rooms = [{kind: 'lobby', name: 'Recepção', w: 17, h: 11 + (drafts.length > 7 ? 2 : 0)}];
  if (lv >= 2) rooms.push({kind: 'meeting', name: 'Reunião', w: 13, h: 9, glass: true});
  if (lv >= 3) rooms.push({kind: 'server', name: 'TI · Servidores', w: 11, h: 7});
  for (const t of teams) {
    const m = staff.filter(b => b.team === t), bosses = m.filter(b => b.role === 'boss').slice(0, 3);
    const workers = m.filter(b => !bosses.includes(b));
    const inner = Math.max(5, (bosses.length ? 3 : 0) + Math.ceil(workers.length / 3) * 3 + 1);
    rooms.push({kind: 'team', name: t, bosses, workers, w: 15, h: inner + 3, color: '#' + (hash(t) & 0xffffff).toString(16).padStart(6, '0')});
  }
  // escolhe quantas salas por fileira para caber melhor na tela
  const place = pr => { let y = 2, maxX = 0; for (let i = 0; i < rooms.length; i += pr) {
      const row = rooms.slice(i, i + pr); let x = 2;
      for (const r of row) { r.x = x; r.y = y; x += r.w + 2; }
      maxX = Math.max(maxX, x); y += Math.max(...row.map(r => r.h)) + 3; } return [maxX, y - 1]; };
  const wrap = $('wrap'), fit = pr => { const [w, h] = place(pr); return Math.min(wrap.clientWidth / (w * T), wrap.clientHeight / (h * T)); };
  let best = 1; for (let pr = 2; pr <= Math.min(4, rooms.length); pr++) if (fit(pr) > fit(best) + 0.01) best = pr;
  PER_ROW = best; [W, H] = place(best);
  tiles = Array.from({length: H}, () => Array(W).fill('hall')); solid = new Set(); furn = [];
  for (let x = 0; x < W; x++) { tiles[0][x] = 'outer'; tiles[H - 1][x] = 'outer'; }
  for (let yy = 0; yy < H; yy++) { tiles[yy][0] = 'outer'; tiles[yy][W - 1] = 'outer'; }
  const seats = {}, spots = {};
  const put = (type, x, y, w = 1, h = 1, o = {}) => { furn.push({type, x, y, w, h, ...o}); if (o.solid !== false) for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) solid.add(key(x + i, y + j)); };
  for (const r of rooms) {
    for (let yy = r.y; yy < r.y + r.h; yy++) for (let xx = r.x; xx < r.x + r.w; xx++) {
      tiles[yy][xx] = yy < r.y + 2 ? 'face' : (xx === r.x || xx === r.x + r.w - 1 || yy === r.y + r.h - 1) ? 'wall' : 'floor';
    }
    const dx = r.x + Math.floor(r.w / 2) - 1; tiles[r.y + r.h - 1][dx] = tiles[r.y + r.h - 1][dx + 1] = 'door';
    r.door = {x: dx, y: r.y + r.h};
    const ix = r.x + 1, iy = r.y + 2, iw = r.w - 2, ih = r.h - 3;
    if (r.kind !== 'server') for (let k = 0; k < Math.floor(r.w / 5); k++) furn.push({type: 'window', x: r.x + 2 + k * 5, y: r.y, w: 2, h: 1, solid: false});
    if (r.kind === 'lobby') {
      put('sofa', ix, iy, 3, 1); put('plant', ix + 3, iy);
      put('counter', ix + 5, iy + 2, 4, 1);
      put('coffee', ix + 13, iy); spots.coffee = {x: ix + 13, y: iy + 1, face: 'up'};
      put('cooler', ix + 14, iy); spots.cooler = {x: ix + 14, y: iy + 1, face: 'up'};
      put('rug', ix + 4, iy + 4, 7, 2, {solid: false});
      put('plant', ix, iy + ih - 1); put('plant', ix + iw - 1, iy + ih - 1);
      if (lv >= 2) furn.push({type: 'tv', x: r.x + 7, y: r.y, w: 3, h: 2, solid: false});
      if (lv >= 3) put('trophy', ix + 11, iy);
      if (lv >= 4) put('shelf', ix + 9, iy, 2, 1);
      r.board = {x: ix + 1, y: iy + ih - 3};
      drafts.forEach((b, i) => { spots['draft:' + b.id] = {x: ix + 1 + (i % 7) * 2, y: iy + ih - 2 - Math.floor(i / 7), face: 'up'}; });
    } else if (r.kind === 'meeting') {
      put('mtable', ix + 3, iy + 2, 5, 2); spots.meeting = [];
      for (let k = 0; k < 5; k++) { furn.push({type: 'mchair', x: ix + 3 + k, y: iy + 1, w: 1, h: 1, solid: false, face: 'down'});
        furn.push({type: 'mchair', x: ix + 3 + k, y: iy + 4, w: 1, h: 1, solid: false, face: 'up'});
        spots.meeting.push({x: ix + 3 + k, y: iy + 1, face: 'down'}, {x: ix + 3 + k, y: iy + 4, face: 'up'}); }
      put('plant', ix, iy); put('plant', ix + iw - 1, iy);
      furn.push({type: 'board', x: r.x + 5, y: r.y, w: 3, h: 2, solid: false});
    } else if (r.kind === 'server') {
      for (let k = 0; k < iw; k++) if (k !== 4) put('rack', ix + k, iy);
      put('console', ix + 4, iy); spots.server = {x: ix + 4, y: iy + 1, face: 'up'};
    } else {
      const bx = [[6], [3, 9], [2, 6, 10]][r.bosses.length - 1] || [];
      r.bosses.forEach((b, i) => {
        const x = ix + bx[i]; seats[b.id] = {x, y: iy, face: 'down', boss: true};
        put('bossdesk', x - 1, iy + 1, 3, 1); spots[b.id] = {x, y: iy + 2, face: 'up'};
      });
      const wy = iy + (r.bosses.length ? 3 : 0);
      r.workers.forEach((b, k) => {
        const sx = ix + 1 + (k % 3) * 4, sy = wy + Math.floor(k / 3) * 3;
        put('desk', sx, sy, 2, 1, {owner: b.id}); seats[b.id] = {x: sx, y: sy + 1, face: 'up'};
        spots[b.id] = {x: sx + 1, y: sy + 1, face: 'left'};
      });
      r.bosses.forEach(b => furn.push({type: 'bossdesk-owner', owner: b.id, x: seats[b.id].x - 1, y: iy + 1, w: 3, h: 1, solid: false}));
      if (!solid.has(key(ix, iy + ih - 1))) put('plant', ix, iy + ih - 1);
      if (!solid.has(key(ix + iw - 1, iy + ih - 1))) put('plant', ix + iw - 1, iy + ih - 1);
      furn.push({type: 'board', x: r.x + r.w - 5, y: r.y, w: 3, h: 2, solid: false});
    }
  }
  L = {seats, spots, lobby: rooms[0], level: level(staff.length)};
  renderStatic();
}
const walkable = (x, y) => x >= 0 && y >= 0 && x < W && y < H && ['hall', 'floor', 'door'].includes(tiles[y][x]) && !solid.has(key(x, y));
function path(sx, sy, tx, ty) {   // BFS (custo uniforme)
  if (sx === tx && sy === ty) return [];
  const prev = new Map([[key(sx, sy), null]]), q = [[sx, sy]];
  for (let qi = 0; qi < q.length; qi++) {
    const [x, y] = q[qi];
    for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + ax, ny = y + ay, k = key(nx, ny);
      if (prev.has(k) || !(walkable(nx, ny) || (nx === tx && ny === ty))) continue;
      prev.set(k, [x, y]);
      if (nx === tx && ny === ty) { const out = []; let c = [nx, ny]; while (c && !(c[0] === sx && c[1] === sy)) { out.unshift(c); c = prev.get(key(...c)); } return out; }
      q.push([nx, ny]);
    }
  }
  return null;
}

/* ============================== DESENHO: cenário ============================== */
function px(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function drawTile(g, x, y, t) {
  const X = x * T, Y = y * T;
  if (t === 'outer') { px(g, X, Y, T, T, '#2a2433'); return; }
  if (t === 'hall' || t === 'door') { px(g, X, Y, T, T, (x + y) % 2 ? '#dcd7ca' : '#d3cdbe'); px(g, X, Y + 15, T, 1, '#c7c0af'); px(g, X + 15, Y, 1, T, '#cbc4b3');
    if (t === 'door') { px(g, X, Y, T, T, '#b98d5a'); px(g, X + 1, Y + 3, 14, 10, '#7d3434'); px(g, X + 2, Y + 4, 12, 8, '#9e4444'); } else ao(g, x, y); return; }
  if (t === 'wall') { px(g, X, Y, T, T, '#4d4152'); px(g, X, Y, T, 3, '#6a5c70'); px(g, X, Y + 15, T, 1, '#3a3140'); return; }
  if (t === 'face') { const top = tiles[y - 1]?.[x] !== 'face';
    px(g, X, Y, T, T, '#ece4d6'); if (top) { px(g, X, Y, T, 3, '#4d4152'); px(g, X, Y + 3, T, 1, '#d8ccb8'); }
    else { px(g, X, Y + 11, T, 5, '#8c7a66'); px(g, X, Y + 11, T, 1, '#a8957f'); } return; }
}
function roomAt(x, y) { return rooms.find(r => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h); }
function drawFloor(g, x, y) {
  const r = roomAt(x, y), X = x * T, Y = y * T;
  if (r.kind === 'lobby') { px(g, X, Y, T, T, '#c89b62'); px(g, X, Y + 7, T, 1, '#b3874f'); px(g, X + ((y % 2) ? 5 : 11), Y, 1, 7, '#b3874f'); px(g, X + ((y % 2) ? 11 : 3), Y + 8, 1, 8, '#b3874f'); }
  else if (r.kind === 'meeting') { px(g, X, Y, T, T, '#8d97ab'); px(g, X, Y, T, 1, '#98a2b6'); px(g, X + ((x + y) % 2) * 8, Y + 8, 8, 8, '#8690a4'); }
  else if (r.kind === 'server') { px(g, X, Y, T, T, '#59606f'); px(g, X, Y, T, 1, '#6c7384'); px(g, X, Y, 1, T, '#6c7384'); px(g, X + 7, Y + 7, 2, 2, '#4a505d'); }
  else { const base = shade(r.color, 1.55), dark = shade(r.color, 1.42);
    px(g, X, Y, T, T, base); for (let i = 0; i < 4; i++) px(g, X + ((i * 5 + y * 3) % 14), Y + ((i * 7 + x * 5) % 14), 2, 2, dark); }
  ao(g, x, y);
}
function ao(g, x, y) {  // sombra de contato junto às paredes = profundidade
  const X = x * T, Y = y * T, up = tiles[y - 1]?.[x], lf = tiles[y]?.[x - 1];
  if (up === 'face' || up === 'wall') { g.fillStyle = 'rgba(0,0,0,.16)'; g.fillRect(X, Y, T, 4); g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(X, Y + 4, T, 3); }
  if (lf === 'wall' || lf === 'outer') { g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(X, Y, 3, T); }
}
function drawFurn(g, f, top) {
  const X = f.x * T, Y = f.y * T;
  if (!top && f.solid !== false && !['rug'].includes(f.type)) { g.fillStyle = 'rgba(0,0,0,.16)'; g.fillRect(X + 2, Y + f.h * T - 1, f.w * T - 2, 3); }
  switch (f.type) {
    case 'mtable': if (top) return; px(g, X, Y + 2, f.w * T, f.h * T - 4, '#6e4b33'); px(g, X + 1, Y + 3, f.w * T - 2, f.h * T - 8, '#9a6c48');
      px(g, X + 3, Y + 5, f.w * T - 6, 1, '#b0825c'); for (let k = 0; k < f.w; k++) { px(g, X + k * T + 5, Y + 8, 6, 4, '#fbfbf8'); px(g, X + k * T + 6, Y + 9, 4, 1, '#b7b7c4'); }
      px(g, X + f.w * T / 2 - 4, Y + 16, 8, 6, '#2b2f3a'); px(g, X + f.w * T / 2 - 3, Y + 17, 6, 3, '#5fd3ff'); break;
    case 'mchair': if (top) return; px(g, X + 3, Y + 4, 10, 9, '#2e3350'); px(g, X + 4, Y + 5, 8, 6, '#3d4468'); break;
    case 'rack': if (top) return; px(g, X + 1, Y - 15, 14, 29, '#1b1e28'); px(g, X + 2, Y - 14, 12, 27, '#262a37');
      for (let k = 0; k < 6; k++) px(g, X + 3, Y - 12 + k * 4, 10, 3, '#313647'); break;
    case 'console': if (top) return; px(g, X + 2, Y + 2, 12, 10, '#3a4050'); px(g, X + 3, Y - 4, 10, 7, '#1b1e28'); px(g, X + 4, Y - 3, 8, 5, '#34d399'); break;
    case 'window': if (top) return; px(g, X + 2, Y + 4, 28, 18, '#f4f1ea'); px(g, X + 4, Y + 6, 24, 14, '#8fd0f2'); px(g, X + 4, Y + 6, 24, 5, '#b6e3f9'); px(g, X + 15, Y + 6, 2, 14, '#f4f1ea'); break;
    case 'tv': if (top) return; px(g, X + 2, Y + 3, 44, 24, '#1d1b24'); px(g, X + 4, Y + 5, 40, 20, '#2f6db5'); px(g, X + 8, Y + 17, 5, 6, '#ffcf5a'); px(g, X + 15, Y + 12, 5, 11, '#5fd38d'); px(g, X + 22, Y + 8, 5, 15, '#ff8a65'); px(g, X + 29, Y + 14, 5, 9, '#b39ddb'); break;
    case 'board': if (top) return; px(g, X + 2, Y + 4, 44, 22, '#9aa0a6'); px(g, X + 3, Y + 5, 42, 20, '#fbfbf8'); px(g, X + 7, Y + 9, 18, 2, '#e05a5a'); px(g, X + 7, Y + 14, 26, 2, '#4f8cff'); px(g, X + 7, Y + 19, 12, 2, '#33a06f'); px(g, X + 30, Y + 8, 10, 10, '#ffcf5a'); break;

function drawChar(g, c, t) {

    px(g, X + 5, Y + 17, 2, 4 + (l ? 0 : step), '#2d3142'); px(g, X + 9, Y + 17, 2, 4 - (l ? 0 : step), '#2d3142');
    px(g, X + 5, Y + 20 + (l ? 0 : step), 2, 1, out); px(g, X + 9, Y + 20 - (l ? 0 : step), 2, 1, out);

  }

  if (!boss && d === 'down') px(g, X + 7, Y + 11, 2, 1, sd);

  if (d === 'down' || d === 'up') { px(g, bx - 1, Y + 12 + (walking ? step : 0) - (typing && ta ? 1 : 0), 1, 4, suitD); px(g, bx + bw, Y + 12 - (walking ? step : 0) - (typing && !ta ? 1 : 0), 1, 4, suitD);
    px(g, bx - 1, Y + 16 + (walking ? step : 0) - (typing && ta ? 1 : 0), 1, 1, skin); px(g, bx + bw, Y + 16 - (walking ? step : 0) - (typing && !ta ? 1 : 0), 1, 1, skin); }

}

class Char {
  constructor(info, x, y) { this.id = info.id; this.upd(info); this.x = x * T; this.y = y * T; this.tx = x; this.ty = y; this.dir = 'down';

  upd(i) { this.info = i; this.name = i.name; this.color = i.color || '#4f8cff'; this.role = i.role; }

  say(text, ms = 2600, color) { this.bubble = {text, until: now() + ms, color}; }
  go(p) { if (p) this.actions.push({type: 'go', x: p.x, y: p.y, face: p.face}); return this; }

  think(t) {

    if (!this.atSeat()) { this.go(s); return; }
    this.dir = s.face;
    if (busy || paused || i.status === 'draft' || t < this.next) return this.wait(400);
    this.next = t + 5000 + Math.random() * 12000;
    const r = Math.random(), mates = [...chars.values()].filter(c => c !== this && c.info.team === i.team && L.spots[c.id] && c.info.status !== 'draft');
    const boss = mates.find(c => c.role === 'boss');
    if (r < 0.18) this.go(rnd([L.spots.coffee, L.spots.cooler])).then(() => this.say(rnd(['☕', '💧', 'hmm…']), 1800)).wait(2200).go(s);
    else if (r < 0.32 && mates.length) { const m = rnd(mates); this.go(L.spots[m.id]).then(() => { this.say(rnd(['bom dia!', 'tudo certo?', 'bora!', '📊?'])); setTimeout(() => m.say(rnd(['👍', 'tudo!', 'opa!']), 1600), 900); }).wait(2400).go(s); }
    else if (r < 0.38 && boss && this.role !== 'boss') this.go(L.spots[boss.id]).then(() => this.say('📋 status ok')).wait(2200).go(s);
    else if (r < 0.46 && L.spots.meeting) { const m = rnd(L.spots.meeting); this.go(m).then(() => this.say(rnd(['alinhamento', '📈 metas', 'ideias?']), 2000)).wait(4000 + Math.random() * 3000).go(s); }
    else if (r < 0.49 && L.spots.server) this.go(L.spots.server).then(() => this.say('checando servidor', 1800)).wait(2500).go(s);
    else this.wait(600);
  }

    if (!this.actions.length) this.think(t);

    this.moving = false;

}

function syncBots(list) {
  const all = list;
  const sig = JSON.stringify(list.map(b => [b.id, b.team, b.role, b.status === 'draft']));
  if (sig !== layoutSig) { layoutSig = sig; buildLayout(list);
    for (const c of chars.values()) { c.actions = []; if (!walkable(c.tx, c.ty) && !(c.seat && c.seat.x === c.tx && c.seat.y === c.ty)) { const d = L.lobby.door; c.x = d.x * T; c.y = d.y * T; c.tx = d.x; c.ty = d.y; } } }
  const ids = new Set(all.map(b => b.id));
  for (const id of [...chars.keys()]) if (!ids.has(id)) chars.delete(id);
  for (const b of all) {
    if (chars.has(b.id)) { chars.get(b.id).upd(b); continue; }
    const d = L.lobby.door, first = !cursorStarted, s = b.status === 'draft' ? L.spots['draft:' + b.id] : L.seats[b.id];
    const c = first && s ? new Char(b, s.x, s.y) : new Char(b, d.x, d.y);
    if (!first) c.say('Olá! 👋', 3000);
    chars.set(b.id, c);
  }
  const runs = list.reduce((a, b) => a + (b.stats.runs || 0), 0), ok = list.reduce((a, b) => a + (b.stats.ok || 0), 0);
  $('nb').textContent = list.filter(b => b.status !== 'draft').length; $('level').textContent = L.level[0];
  $('nw').textContent = all.filter(b => b.activity === 'running' || b.activity === 'queued').length;
  $('na').textContent = all.filter(b => b.activity === 'waiting_approval').length;
  $('ns').textContent = runs ? Math.round(ok / runs * 100) + '%' : '—';
  renderTeam();
}

cv.addEventListener('click', ev => {
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) / SCALE, y = (ev.clientY - r.top) / SCALE;
