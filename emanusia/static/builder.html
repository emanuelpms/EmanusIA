<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Construtor de robôs</title>
<style>
:root{--bg:#0b1220;--side:#0f1729;--card:#131c2e;--card2:#182339;--fg:#e6ecf5;--mut:#8a97ad;--line:#22304a;--acc:#4f8cff;--ok:#22c7a9;--warn:#ffb020;--bad:#ff6b6b;--sel:#4f8cff33}
@media(prefers-color-scheme:light){:root{--bg:#f4f6fb;--side:#fff;--card:#fff;--card2:#f7f9fd;--fg:#0f172a;--mut:#64748b;--line:#e2e8f0;--sel:#4f8cff1f}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--side);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .back{color:var(--mut);text-decoration:none;padding:6px 8px;border-radius:8px}header .back:hover{background:var(--line)}
header input,header select{width:auto}#bn{font-weight:600;font-size:15px;min-width:220px;flex:0 1 320px}
.sp{flex:1}.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--mut);white-space:nowrap}
.chip.ok{background:#22c7a92a;color:var(--ok)}.chip.bad{background:#ff6b6b2a;color:var(--bad)}.chip.warn{background:#ffb0202a;color:var(--warn)}
#app{flex:1;display:grid;grid-template-columns:270px 1fr 380px;min-height:0}
aside,main{overflow:auto;min-height:0}aside#lib{background:var(--side);border-right:1px solid var(--line);padding:10px}
aside#props{background:var(--side);border-left:1px solid var(--line);padding:14px}main#flow{padding:16px 22px 80px}
button.b,a.b{all:unset;cursor:pointer;background:var(--acc);color:#fff;padding:7px 13px;border-radius:9px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
button.b.sec{background:var(--line);color:var(--fg)}button.b.bad{background:var(--bad)}button.b.okb{background:var(--ok);color:#00201a}button.b:disabled{opacity:.45;cursor:default}
button.l{all:unset;cursor:pointer;color:var(--acc);font-size:13px}button.l:hover{text-decoration:underline}
input,select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;width:100%}
textarea{font-family:inherit;resize:vertical}textarea.code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:12.5px}label .req{color:var(--bad)}
.help{font-size:12px;color:var(--mut);margin-top:3px}.mut{color:var(--mut)}.small{font-size:12.5px}
/* biblioteca */
#q{margin-bottom:8px}.cat{margin-bottom:4px}.cat>summary{list-style:none;cursor:pointer;padding:7px 8px;border-radius:8px;display:flex;gap:8px;align-items:center;font-weight:600}
.cat>summary::-webkit-details-marker{display:none}.cat>summary:hover{background:var(--line)}.cat>summary .n{margin-left:auto;font-weight:400;font-size:12px;color:var(--mut)}
.act{all:unset;display:block;cursor:pointer;padding:6px 8px 6px 30px;border-radius:7px;font-size:13px;box-sizing:border-box;width:100%}
.act:hover{background:var(--sel)}.act .d{display:block;font-size:11.5px;color:var(--mut);line-height:1.3}.act.no{opacity:.4;cursor:not-allowed}
#where{font-size:12px;background:var(--sel);border-radius:8px;padding:6px 8px;margin-bottom:8px}
/* fluxo */
.banner{border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:13.5px}.banner.bad{background:#ff6b6b1f;border:1px solid var(--bad)}
.banner.ok{background:#22c7a91f;border:1px solid var(--ok)}.banner.warn{background:#ffb0201f;border:1px solid var(--warn)}
.list{display:flex;flex-direction:column;gap:6px}.step{background:var(--card);border:1px solid var(--line);border-radius:12px}
.step.sel>.hd{background:var(--sel)}.step.sel{border-color:var(--acc)}.step.bad{border-color:var(--bad)}.step.ok{border-color:#22c7a988}.step.run{border-color:var(--warn)}
.hd{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;cursor:pointer;border-radius:12px}
.num{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;flex:none;font-weight:600}
.step.ok>.hd .num{background:var(--ok);color:#00201a}.step.bad>.hd .num{background:var(--bad);color:#fff}
.ic{font-size:18px;line-height:26px;flex:none}.tx{flex:1;min-width:0}.tx b{font-weight:600}.desc{color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
.prob{color:var(--bad);font-size:12.5px;margin-top:3px}.res{font-size:12.5px;margin-top:4px;color:var(--ok)}.res.e{color:var(--bad)}
.acts{display:flex;gap:2px;flex:none;opacity:.55}.hd:hover .acts,.step.sel>.hd .acts{opacity:1}
.acts button{all:unset;cursor:pointer;padding:3px 6px;border-radius:6px;font-size:13px}.acts button:hover{background:var(--line)}
.kids{padding:0 10px 10px 46px;display:flex;flex-direction:column;gap:8px}
.slot{border-left:3px solid var(--line);padding-left:10px}.slot.tg{border-left-color:var(--acc)}
.slotlbl{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:2px 0 6px}
.add{all:unset;cursor:pointer;font-size:12.5px;color:var(--mut);border:1px dashed var(--line);border-radius:8px;padding:5px 10px;margin-top:6px;display:inline-block}
.add:hover,.add.tg{color:var(--acc);border-color:var(--acc)}
table.pv{border-collapse:collapse;font-size:11.5px;margin-top:6px;max-width:100%;display:block;overflow:auto}table.pv td{border:1px solid var(--line);padding:2px 6px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
table.pv tr:first-child td{font-weight:600;background:var(--card2)}
.empty{text-align:center;padding:30px 10px}.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:14px;text-align:left}
.tpl{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.tpl:hover{border-color:var(--acc)}
.tpl b{display:block;margin:4px 0}.tpl .i{font-size:22px}
/* propriedades */
#props h3{margin:0 0 2px;font-size:16px}.kv{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px}
.rowsed{border:1px solid var(--line);border-radius:9px;padding:8px;margin-bottom:6px;background:var(--card2)}
.rowsed .g{display:grid;grid-template-columns:1fr 1fr;gap:6px}.rowsed label{margin:4px 0 2px}
.withv{display:flex;gap:4px}.withv>input,.withv>textarea{flex:1}.vb{all:unset;cursor:pointer;padding:0 8px;border:1px solid var(--line);border-radius:8px;color:var(--acc);font-weight:700;display:grid;place-items:center}
.vb:hover{background:var(--sel)}.cond{display:grid;grid-template-columns:1fr;gap:6px}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}details.more summary{cursor:pointer;color:var(--mut);font-size:13px}
.pop{position:fixed;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #0007;max-height:320px;overflow:auto;min-width:240px;display:none;padding:4px}
.pop button{all:unset;cursor:pointer;display:block;padding:6px 10px;border-radius:7px;font-size:13px;width:100%;box-sizing:border-box}.pop button:hover{background:var(--sel)}
.pop .sub{padding-left:24px;color:var(--mut)}.pop .h{font-size:11px;color:var(--mut);padding:6px 10px 2px;text-transform:uppercase}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:40}.modal.show{display:flex}
.modal>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(640px,94vw);max-height:90vh;overflow:auto}
pre{background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:9px;white-space:pre-wrap;font-size:12.5px;max-height:60vh;overflow:auto}
.out{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:14px;font-size:13px}
@media(max-width:1100px){#app{grid-template-columns:230px 1fr 320px}}
@media(max-width:820px){body{overflow:auto}#app{display:block}aside,main{overflow:visible}aside#lib,aside#props{border:0;border-bottom:1px solid var(--line)}}
</style>
<body>
<header>
  <a class="back" href="/?tab=bots" title="Voltar para os robôs">← Robôs</a>
  <input id="bn" placeholder="Nome do robô (ex.: Lançar notas fiscais)">
  <input id="bt" placeholder="Time" style="max-width:130px" list="teams"><datalist id="teams"></datalist>
  <select id="br" style="max-width:160px"><option value="worker">🤖 Funcionário</option><option value="boss">👔 Chefe</option></select>
  <span id="status" class="chip">novo</span>
  <span class="sp"></span>
  <button class="b sec" id="undo" title="Desfazer (Ctrl+Z)" onclick="undo()" disabled>↶</button>
  <button class="b sec" onclick="showYaml()" title="Ver o código gerado">{ } Código</button>
  <button class="b sec" onclick="save(true)">💾 Salvar</button>
  <button class="b okb" id="testb" onclick="test()">▶ Testar</button>
</header>
<div id="app">
  <aside id="lib"><div id="where"></div><input id="q" placeholder="🔎 Procurar ação (ex.: pdf, nota, e-mail, planilha)"><div id="cats"></div></aside>
  <main id="flow"></main>
  <aside id="props"></aside>
</div>
<div class="pop" id="pop"></div>
<div class="modal" id="modal"><div id="mbody"></div></div>

<script>
/* ===================================================== utilidades */
const $ = s => document.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v; else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
async function api(path, method = 'GET', body) {
  const r = await fetch(path, {method, headers: body ? {'Content-Type': 'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { location.href = '/'; throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail || j));
  return j;
}
const clone = o => JSON.parse(JSON.stringify(o));
const toast = m => alert(m);
function modal(node) { const b = $('#mbody'); b.innerHTML = ''; b.append(node); $('#modal').classList.add('show'); }
function closeModal() { $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* ===================================================== estado */
let CAT = null, ACT = {}, CODE = {params: {}, steps: []}, BOT = null, SEL = null, TARGET = null, CLIP = null;
let DIRTY = false, CHECK = null, TEST = {}, TESTING = false, TESTMSG = null, HIST = [], CREDS = [], BOTS = [], WFS = [], FILES = [];
const CONTAINERS = {if: [['then', 'Então'], ['else', 'Senão']], for_each: [['steps', 'Repetir estes passos']],
  while: [['steps', 'Repetir estes passos']], try: [['try', 'Tentar'], ['catch', 'Se der erro']]};
const kindOf = s => s.tool ? 'tool' : ['if', 'for_each', 'while', 'try', 'set', 'call_bot', 'call', 'log', 'sleep', 'fail'].find(k => k in s) || '?';

function actionOf(s) {
  if (s.tool) return CAT.actions.find(a => a.tool === s.tool && !a.template) || {id: s.tool, title: s.tool, fields: [], cat: 'other'};
  const k = kindOf(s);
  if (k === 'for_each') { const v = String(s.for_each); return ACT[v.startsWith('records(') ? 'for_each_row' : v.startsWith('range(') ? 'repeat' : 'for_each']; }
  return ACT[k] || {id: k, title: k, fields: []};
}
const catIcon = id => (CAT.categories.find(c => c.id === id) || {}).icon || '⚙️';

/* ----- caminhos (mesmo formato do motor: "3", "3.2", "3.else.1") ----- */
function walk(fn) {
  const go = (list, prefix, depth, parent, key) => list.forEach((s, i) => {
    const path = prefix + (i + 1);
    fn({s, path, list, i, depth, parent, key});
    for (const [k] of CONTAINERS[kindOf(s)] || []) go(s[k] || [], path + '.' + (k === 'else' || k === 'catch' ? k + '.' : ''), depth + 1, s, k);
  });
  go(CODE.steps, '', 0, null, null);
}
function find(step) { let out = null; walk(x => { if (x.s === step) out = x; }); return out; }

/* ----- campos: ler/gravar no passo ----- */
const keysOf = f => [].concat(f.key || ('args.' + f.name));
function getK(s, key) { const p = key.split('.'); let c = s; for (const k of p) { if (c == null) return undefined; c = c[k]; } return c; }
function setK(s, key, v) {
  const p = key.split('.'); let c = s;
  for (const k of p.slice(0, -1)) { if (c[k] == null || typeof c[k] !== 'object') c[k] = {}; c = c[k]; }
  const last = p[p.length - 1];
  const own = !s.tool && p.length === 1 && ['if', 'for_each', 'while', 'log', 'fail', 'call_bot', 'call', 'set', 'sleep'].includes(key);
  if (v === undefined || v === '' || (Array.isArray(v) && !v.length) || (v && typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length)) {
    if (own) c[last] = key === 'set' ? {} : (v ?? ''); else delete c[last];
  } else c[last] = v;
  if (p[0] === 'args' && s.args && !Object.keys(s.args).length) delete s.args;
}
function readField(s, f) {
  let v = getK(s, keysOf(f)[0]);
  if (f.wrap && typeof v === 'string') { const [a, b] = f.wrap.split('{}'); if (v.startsWith(a) && v.endsWith(b)) v = v.slice(a.length, v.length - b.length); }
  return v;
}
function writeField(s, f, v) {
  if (f.wrap && v !== undefined && v !== '') v = f.wrap.replace('{}', v);
  for (const k of keysOf(f)) setK(s, k, v);
}

/* ===================================================== histórico */
function snap() { HIST.push(JSON.stringify(CODE)); if (HIST.length > 80) HIST.shift(); $('#undo').disabled = false; }
let typingSnap = null;
function changed(rebuildProps = false) {
  DIRTY = true; renderFlow(); if (rebuildProps) renderProps(); scheduleCheck(); setStatus();
}
function softSnap() { if (!typingSnap) snap(); clearTimeout(typingSnap); typingSnap = setTimeout(() => typingSnap = null, 1200); }
function undo() {
  if (!HIST.length) return;
  CODE = JSON.parse(HIST.pop()); SEL = null; TARGET = null; $('#undo').disabled = !HIST.length; changed(true);
}

/* ===================================================== biblioteca de ações */
function renderLib() {
  const q = $('#q').value.trim().toLowerCase(), box = $('#cats'); box.innerHTML = '';
  const norm = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  for (const c of CAT.categories) {
    const acts = CAT.actions.filter(a => a.cat === c.id && (!q || norm(a.title + ' ' + (a.desc || '') + ' ' + c.name + ' ' + (a.tool || '')).includes(norm(q))));
    if (!acts.length) continue;
    const d = h('details', {class: 'cat', open: !!q || c.id === 'flow' ? true : undefined},
      h('summary', {title: c.desc}, h('span', {}, c.icon), c.name, h('span', {class: 'n'}, acts.length)),
      acts.map(a => h('button', {class: 'act' + (a.allowed === false ? ' no' : ''), title: a.desc || a.title,
        onclick: () => a.allowed === false ? toast('Você não tem permissão para esta ação.') : addAction(a)},
        a.title + (a.risky ? ' ⚠️' : '') + (a.needs ? ' 🔌' : ''), q && a.desc ? h('span', {class: 'd'}, a.desc) : null)));
    box.append(d);
  }
  renderWhere();
}
function renderWhere() {
  let t = 'Clique numa ação para adicionar <b>no fim</b>.';
  if (TARGET) { const x = TARGET.step ? find(TARGET.step) : null; const lbl = (CONTAINERS[kindOf(TARGET.step)] || []).find(([k]) => k === TARGET.key);
    t = `Adicionando em <b>${lbl ? lbl[1] : ''}</b> do passo ${x ? x.path : ''}. <button class="l" onclick="TARGET=null;renderFlow();renderWhere()">no fim</button>`; }
  else if (SEL) { const x = find(SEL); if (x) t = `Adicionando <b>depois do passo ${x.path}</b>. <button class="l" onclick="SEL=null;renderFlow();renderProps();renderWhere()">no fim</button>`; }
  $('#where').innerHTML = t;
}
function insertAt() {
  if (TARGET) { const lst = TARGET.step[TARGET.key] = TARGET.step[TARGET.key] || []; return [lst, lst.length]; }
  if (SEL) { const x = find(SEL); if (x) return [x.list, x.i + 1]; }
  return [CODE.steps, CODE.steps.length];
}
function usedNames() { const n = new Set(Object.keys(CODE.params || {})); walk(({s}) => { if (s.save_as) n.add(s.save_as); if (s.set) Object.keys(s.set).forEach(k => n.add(k)); }); return n; }
function freshName(base) { const u = usedNames(); if (!u.has(base)) return base; let i = 2; while (u.has(base + i)) i++; return base + i; }

function newStep(a) {
  const s = a.step ? clone(a.step) : {tool: a.tool};
  for (const f of a.fields || []) {
    if (f.name === 'save_as' && f.key === 'save_as' && a.tool) { writeField(s, f, freshName(f.default || 'resultado')); continue; }
    if (f.default !== undefined && !f.adv && readField(s, f) === undefined) writeField(s, f, f.default);
  }
  return s;
}
function addAction(a) {
  if (a.template) return askTemplate(a);
  snap();
  const s = newStep(a), [lst, i] = insertAt();
  lst.splice(i, 0, s); SEL = s; TARGET = null; changed(true);
}
function askTemplate(a) {
  const vals = {};
  const box = h('div', {}, h('h3', {}, a.title), a.desc ? h('p', {class: 'mut small'}, a.desc) : null,
    (a.fields || []).map(f => { vals[f.name] = f.default ?? ''; return h('div', {}, h('label', {}, f.label),
      h('input', {value: vals[f.name], placeholder: f.placeholder || '', oninput: e => vals[f.name] = e.target.value})); }),
    h('p', {}, h('button', {class: 'b', onclick: () => { closeModal(); insertTemplate(a, vals); }}, 'Adicionar')));
  modal(box);
}
function insertTemplate(a, vals) {
  const sub = v => {
    if (typeof v === 'string') { const m = v.match(/^\$(\w+)$/); if (m && m[1] in vals) { const x = vals[m[1]]; return /^-?\d+(\.\d+)?$/.test(x) ? +x : x; }
      return v.replace(/\$(\w+)/g, (_, k) => k in vals ? vals[k] : '$' + k); }
    if (Array.isArray(v)) return v.map(sub);
    if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k, x]) => [sub(k), sub(x)]));
    return v;
  };
  snap();
  const steps = sub(clone(a.template)), [lst, i] = insertAt();
  for (const s of steps) if (s.save_as) s.save_as = freshName(s.save_as);
  // o "para cada" usa a lista que o passo anterior guardou (pode ter ganhado outro nome)
  steps.forEach((s, k) => { if (k && 'for_each' in s && steps[k - 1].save_as) s.for_each = steps[k - 1].save_as; });
  lst.splice(i, 0, ...steps);
  SEL = steps[steps.length - 1]; TARGET = (CONTAINERS[kindOf(SEL)] || [])[0] ? {step: SEL, key: CONTAINERS[kindOf(SEL)][0][0]} : null;
  changed(true);
}

/* ===================================================== fluxo (lista de passos) */
function renderFlow() {
  const m = $('#flow'), top = m.scrollTop; m.innerHTML = '';
  if (TESTMSG) m.append(h('div', {class: 'banner ' + TESTMSG.cls, html: TESTMSG.html}));
  if (CHECK && !CHECK.ok && CODE.steps.length) m.append(h('div', {class: 'banner bad'}, h('b', {}, '⚠ Falta ajustar: '),
    CHECK.problems.length + ' ponto(s) em vermelho.', CHECK.problems.filter(p => !p.path).map(p => h('div', {}, '• ' + p.text))));
  const pnames = Object.keys(CODE.params || {});
  m.append(h('div', {class: 'small mut', style: 'margin-bottom:10px;cursor:pointer', onclick: () => { SEL = null; TARGET = null; renderFlow(); renderProps(); renderWhere(); }},
    '🧷 Informações do robô: ', pnames.length ? pnames.map(n => '«' + n + '»').join(' ') : 'nenhuma', ' — clique para editar'));
  if (!CODE.steps.length) { m.append(emptyState()); renderWhere(); return; }
  m.append(listEl(CODE.steps, null, null));
  m.append(h('button', {class: 'add' + (!TARGET && !SEL ? ' tg' : ''), onclick: () => { TARGET = null; SEL = null; renderFlow(); renderProps(); renderWhere(); }}, '+ adicionar no fim'));
  if (CLIP) m.append(' ', h('button', {class: 'add', onclick: () => paste(null, null)}, '📋 colar no fim'));
  m.scrollTop = top; renderWhere();
}
function listEl(list) {
  const box = h('div', {class: 'list'});
  list.forEach(s => box.append(stepEl(s)));
  return box;
}
function problemsAt(path) { return CHECK ? CHECK.problems.filter(p => p.path === path) : []; }
function stepEl(s) {
  const x = find(s), a = actionOf(s), k = kindOf(s), t = TEST[x.path];
  const desc = CHECK && CHECK.steps.find(d => d.path === x.path);
  const probs = problemsAt(x.path), bad = probs.length || (t && t.ok === false);
  const el = h('div', {class: 'step' + (SEL === s ? ' sel' : '') + (bad ? ' bad' : t && t.ok ? ' ok' : '')});

  if ((m = e.match(/^len\((.+)\) (>|==) (-?\d+)$/))) return {l: m[1], op: 'len' + m[2], r: m[3]};
  if ((m = e.match(/^to_number\((.+)\) (==|!=|>=|<=|>|<) (-?\d+(?:\.\d+)?)$/))) return {l: m[1], op: m[2], r: m[3]};
  if ((m = e.match(/^str\((.+)\) (==|!=) (".*")$/))) return {l: m[1], op: m[2], r: JSON.parse(m[3])};
  if ((m = e.match(/^([\w\[\]"'.]+) (>=|<=|>|<) (".*")$/))) return {l: m[1], op: m[2], r: JSON.parse(m[3])};
  return null;
}
function condEl(v, onChange) {
  const box = h('div', {class: 'cond'}); let raw = parseCond(v) === null;
  const draw = () => {
    box.innerHTML = '';
    if (raw) {
      const inp = h('input', {value: v ?? '', placeholder: 'ex.: total > 1000 and len(notas) > 0', oninput: e => { v = e.target.value; onChange(v); }});
      box.append(withVar(inp, 'expr'), h('div', {class: 'help'}, 'Use and / or / not, comparações (> < ==) e as funções da lista {x}. ',
        h('button', {class: 'l', type: 'button', onclick: () => { if (parseCond(v) !== null || !v) { raw = false; draw(); } else toast('Esta condição é avançada demais para o modo simples.'); }}, 'modo simples')));
      return;
    }
    const c = parseCond(v) || {l: '', op: '==', r: ''};
    const li = h('input', {value: c.l, placeholder: 'escolha a informação →'});
    const os = h('select', {}, COPS.map(([a, b]) => h('option', {value: a}, b))); os.value = c.op;
    const ri = h('input', {value: c.r, placeholder: 'valor'});
    const upd = () => { v = buildCond(li.value.trim(), os.value, ri.value); ri.style.display = ['filled', 'empty'].includes(os.value) ? 'none' : ''; onChange(v); };
    li.addEventListener('input', upd); os.addEventListener('change', upd); ri.addEventListener('input', upd);
    ri.style.display = ['filled', 'empty'].includes(c.op) ? 'none' : '';
    box.append(withVar(li, 'expr'), os, ri, h('div', {class: 'help'}, v ? h('code', {}, v) : 'Ex.: total — é maior que — 1000', ' · ',
      h('button', {class: 'l', type: 'button', onclick: () => { raw = true; draw(); }}, 'escrever a condição')));
  };
  draw(); return box;
}

/* ----- painel do robô (nada selecionado) ----- */
function robotPanel(p) {
  p.append(h('h3', {}, '🤖 Informações do robô'), h('div', {class: 'help'}, 'O que muda a cada execução (pasta, data, e-mail de destino…). Quem rodar o robô pode trocar. Use nos passos com {x} ou escrevendo {{nome}}.'));
  const box = h('div'); p.append(box);
  const rows = Object.entries(CODE.params || {}).map(([k, x]) => [k, typeof x === 'object' ? JSON.stringify(x) : String(x)]);
  const emit = () => { softSnap(); CODE.params = {}; for (const [k, x] of rows) { const n = k.trim().replace(/\s+/g, '_'); if (n) CODE.params[n] = isNum(x) ? +x : x === 'true' ? true : x === 'false' ? false : x; } changed(); };
  const draw = () => { box.innerHTML = ''; rows.forEach((r, i) => box.append(h('div', {class: 'kv'},
    h('input', {value: r[0], placeholder: 'nome (ex.: pasta)', oninput: e => { r[0] = e.target.value; emit(); }}),
    h('input', {value: r[1], placeholder: 'valor padrão', oninput: e => { r[1] = e.target.value; emit(); }}),
    h('button', {class: 'b sec', onclick: () => { rows.splice(i, 1); draw(); emit(); }}, '✕'))));
    box.append(h('button', {class: 'l', onclick: () => { rows.push(['', '']); draw(); }}, '+ adicionar informação')); };
  draw();
  p.append(h('label', {}, 'Para que serve este robô'));
  const d = h('textarea', {rows: 3, placeholder: 'Ex.: Todo dia lê os XML das notas que chegam por e-mail e manda a planilha para o financeiro.'});
  d.value = META.description || ''; d.addEventListener('input', () => { META.description = d.value; DIRTY = true; setStatus(); });
  p.append(d);
  if (BOT) {
    const nx = BOT.next || {};
    p.append(h('div', {class: 'out'}, h('b', {}, 'Próximo passo: '), nx.text || '—',
      h('div', {class: 'small mut', style: 'margin-top:6px'}, 'Revisão, ativação e agendamento ficam na página do robô. '),
      h('a', {href: `/?tab=bots&bot=${encodeURIComponent(BOT.id)}`, style: 'color:var(--acc)'}, 'Abrir a página do robô →')));
  }
  p.append(h('div', {class: 'out'}, h('b', {}, 'Como funciona'),
    h('ol', {class: 'small', style: 'padding-left:18px;margin:6px 0 0'}, h('li', {}, 'Escolha as ações à esquerda. Elas entram uma depois da outra.'),
      h('li', {}, 'Clique num passo para preencher o que ele precisa. O resultado de um passo pode ser usado nos próximos com {x}.'),
      h('li', {}, 'Use “Decisões e repetições” para “se…”, “para cada arquivo/linha/e-mail” e “se der erro”.'),
      h('li', {}, '▶ Testar faz o robô trabalhar de verdade e mostra o resultado de cada passo.'))));
}

/* ===================================================== conferir / salvar / testar */
let checkTimer = null;
function scheduleCheck() { clearTimeout(checkTimer); checkTimer = setTimeout(runCheck, 450); }
async function runCheck() {
  try { CHECK = await api('/api/builder/check', 'POST', {code: CODE}); } catch (e) { return null; }
  renderFlow(); if (SEL) { const pr = $('#props'), y = pr.scrollTop; const act = document.activeElement; if (!pr.contains(act)) { renderProps(); pr.scrollTop = y; } }
  setStatus(); return CHECK;
}
const META = {description: ''};
function setStatus() {
  const st = $('#status');
  if (TESTING) { st.className = 'chip warn'; st.textContent = '▶ testando…'; return; }
  if (CHECK && !CHECK.ok && CODE.steps.length) { st.className = 'chip bad'; st.textContent = `⚠ ${CHECK.problems.length} ajuste(s)`; return; }
  if (DIRTY) { st.className = 'chip warn'; st.textContent = '● não salvo'; return; }
  const lbl = {draft: 'rascunho', validated: 'conferido', active: 'trabalhando', paused: 'pausado'};
  st.className = 'chip ' + (BOT && BOT.status === 'active' ? 'ok' : ''); st.textContent = BOT ? '✓ salvo · ' + (lbl[BOT.status] || BOT.status) : 'novo';
}
async function save(explicit = false) {
  const name = $('#bn').value.trim();
  if (!name) { $('#bn').focus(); toast('Dê um nome ao robô.'); return false; }
  const body = {team: $('#bt').value.trim() || 'Geral', role: $('#br').value, description: META.description || '', code: CODE};
  try {
    if (!BOT) { BOT = await api('/api/bots', 'POST', {...body, name, origin: 'construtor'}); history.replaceState(null, '', '/builder?bot=' + encodeURIComponent(BOT.id)); }
    else { await api('/api/bots/' + BOT.id, 'PUT', {...body, name}); await api(`/api/bots/${BOT.id}/validate`, 'POST'); BOT = await api('/api/bots/' + BOT.id); }
    DIRTY = false; setStatus(); if (!SEL) renderProps();
    if (explicit) { const c = await runCheck(); TESTMSG = c && c.ok ? {cls: 'ok', html: '💾 Salvo e conferido. Agora clique em <b>▶ Testar</b> para ver o robô trabalhando.'} : null; renderFlow(); }
    return true;
  } catch (e) { toast(e.message); return false; }
}
async function test() {
  if (!CODE.steps.length) return toast('Adicione pelo menos um passo.');
  if (!(await save())) return;
  const c = await runCheck();
  if (!c || !c.ok) { TESTMSG = {cls: 'bad', html: '<b>Antes de testar, ajuste os pontos em vermelho.</b>'}; renderFlow(); return; }
  if (c.risky_tools.length && !confirm('Este robô vai fazer coisas importantes (' + c.risky_tools.join(', ') + '). Durante o teste ele pede sua permissão antes de cada uma. Continuar?')) return;
  TEST = {}; TESTING = true; TESTMSG = {cls: 'warn', html: '▶ <b>Testando…</b> o robô está trabalhando de verdade. Os passos ficam verdes conforme terminam.'};
  $('#testb').disabled = true; setStatus(); renderFlow();
  let j;
  try {
    j = await api(`/api/bots/${BOT.id}/rehearse`, 'POST', {params: {}});
    let seen = -1, asked = null;
    while (true) {
      const r = await api('/api/jobs/' + j.id);
      const evs = r.events.filter(e => e.kind === 'step_done');
      if (evs.length !== seen) { seen = evs.length; evs.forEach(e => TEST[e.path] = e); renderFlow(); if (SEL) renderProps(); }
      if (r.status === 'waiting_approval' && r.pending && asked !== JSON.stringify(r.pending)) { asked = JSON.stringify(r.pending);
        const ok = confirm('🤖 O robô precisa da sua permissão:\n\n' + (r.pending.text || r.pending.tool) + '\n\nOK = pode fazer · Cancelar = não');
        await api(`/api/jobs/${j.id}/approve`, 'POST', {ok}); }
      if (r.status === 'done' || r.status === 'error') { j = r; break; }
      await new Promise(res => setTimeout(res, 600));
    }
  } catch (e) { toast(e.message); }
  TESTING = false; $('#testb').disabled = false;
  const rep = j && j.result && typeof j.result === 'object' ? j.result : null;
  if (rep && rep.steps) rep.steps.forEach(s => TEST[s.path] = {...(TEST[s.path] || {}), ...s});
  if (rep && rep.ok) TESTMSG = {cls: 'ok', html: '✅ <b>Teste concluído: deu tudo certo!</b> Veja o resultado de cada passo abaixo. ' + (rep.steps.some(s => s.shot) ? 'Clique num passo para ver o print.' : '')};
  else TESTMSG = {cls: 'bad', html: '✖ <b>O robô parou' + (rep && rep.failed_at ? ' no passo ' + rep.failed_at : '') + '.</b> ' + escapeHtml((rep && rep.error) || (j && (j.plain_error || j.result)) || '')};
  try { BOT = await api('/api/bots/' + BOT.id); } catch {}
  setStatus(); renderFlow(); renderProps();
  if (rep && !rep.ok && rep.failed_at) { const x = locate(rep.failed_at); if (x) { SEL = x; renderFlow(); renderProps(); } }
}
function locate(path) { let o = null; walk(x => { if (x.path === path) o = x.s; }); return o; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])); }
async function showYaml() {
  const c = CHECK || await runCheck();
  modal(h('div', {}, h('h3', {style: 'margin-top:0'}, '{ } Código gerado'), h('p', {class: 'small mut'}, 'É isto que o robô executa. Para editar o código à mão, use “Modo avançado” na página do robô.'),
    h('pre', {}, c ? c.yaml : ''), h('button', {class: 'b sec', onclick: () => { navigator.clipboard && navigator.clipboard.writeText(c.yaml); }}, 'Copiar'), ' ', h('button', {class: 'b', onclick: closeModal}, 'Fechar')));
}

/* ===================================================== início */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(true); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) { e.preventDefault(); undo(); }
  if (e.key === 'Escape') { hidePop(); closeModal(); }
});
window.addEventListener('beforeunload', e => { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });
['bn', 'bt', 'br'].forEach(id => $('#' + id).addEventListener('input', () => { DIRTY = true; setStatus(); }));
$('#q').addEventListener('input', renderLib);

async function boot() {
  const me = await fetch('/api/me').then(r => r.json());
  if (!me.user) { location.href = '/'; return; }
  if (me.user.role === 'viewer') { document.body.innerHTML = '<p style="padding:30px">Perfil somente leitura: peça a um admin para montar robôs.</p>'; return; }
  [CAT, CREDS, BOTS, WFS, FILES] = await Promise.all([api('/api/catalog'), api('/api/credentials'), api('/api/bots'), api('/api/workflows'), api('/api/files').catch(() => [])]);
  for (const a of CAT.actions) ACT[a.id] = a;
  const dl = (id, items) => document.body.append(h('datalist', {id}, items.map(v => h('option', {value: v}))));
  dl('filesdl', FILES.map(f => f.path));
  dl('foldersdl', [...new Set(FILES.map(f => f.path.split('/').slice(0, -1).join('/')).filter(Boolean))]);
  $('#teams').append(...[...new Set(BOTS.map(b => b.team))].map(t => h('option', {value: t})));
  const id = new URLSearchParams(location.search).get('bot');
  if (id) {
    try { BOT = await api('/api/bots/' + encodeURIComponent(id)); } catch (e) { toast(e.message); }
    if (BOT && !BOT.can_edit) { toast('Só quem cuida deste robô pode editá-lo.'); BOT = null; }
    if (BOT) { CODE = BOT.code || {params: {}, steps: []}; CODE.params = CODE.params || {}; CODE.steps = CODE.steps || [];
      $('#bn').value = BOT.name; $('#bt').value = BOT.team; $('#br').value = BOT.role; META.description = BOT.description || ''; }
  }
  renderLib(); renderFlow(); renderProps(); setStatus(); runCheck();
}
boot();
</script>
