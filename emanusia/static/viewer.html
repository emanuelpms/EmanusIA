<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visualizador</title>
<style>
:root{--bg:#0b1220;--side:#0f1729;--card:#131c2e;--fg:#e6ecf5;--mut:#8a97ad;--line:#22304a;--acc:#4f8cff}
@media(prefers-color-scheme:light){:root{--bg:#f4f6fb;--side:#fff;--card:#fff;--fg:#0f172a;--mut:#64748b;--line:#e2e8f0}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--side);border-bottom:1px solid var(--line);flex-wrap:wrap}
header a{color:var(--mut);text-decoration:none;padding:6px 8px;border-radius:8px}header a:hover{background:var(--line)}
header b{font-size:15px}.sp{flex:1}.mut{color:var(--mut)}.small{font-size:12.5px}
a.b{background:var(--line);color:var(--fg)!important}
main{flex:1;min-height:0;overflow:auto}
iframe,embed{border:0;width:100%;height:100%;display:block;background:#fff}
.tabs{display:flex;gap:2px;padding:6px 10px 0;background:var(--side);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;border-radius:8px 8px 0 0;color:var(--mut)}.tabs button.on{background:#fff;color:#0f172a;font-weight:600}
.sheetwrap{padding:12px;overflow:auto}.sheet{position:relative;display:inline-block;background:#fff;color:#111;box-shadow:0 1px 6px #0003}
table.g{border-collapse:collapse;table-layout:fixed;font:13px Calibri,"Segoe UI",Arial,sans-serif}
table.g td{border:1px solid #e3e6ea;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
table.g.nogrid td{border-color:transparent}
table.g td.n{text-align:right}table.g td.t{overflow:visible;text-overflow:clip}table.g th{background:#f3f4f6;color:#6b7280;font-weight:400;font-size:11px;border:1px solid #e3e6ea;position:sticky;top:0}
table.g td.rh{background:#f3f4f6;color:#6b7280;font-size:11px;text-align:center}
.chart{position:absolute;background:#fff;border:1px solid #d9dee6;border-radius:4px}
.note{padding:8px 14px;font-size:12.5px;color:var(--mut)}
pre{margin:0;padding:16px;white-space:pre-wrap;font-size:13px}
.center{display:grid;place-items:center;height:100%;padding:20px;text-align:center}
img.full{max-width:100%;max-height:100%;display:block;margin:auto}
.pages{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}.pages img{max-width:min(1000px,100%);background:#fff;box-shadow:0 2px 10px #0004;min-height:200px}
</style>
<body>
<header><a href="javascript:history.length>1?history.back():location.href='/?tab=files'">← Voltar</a>
  <b id="name">…</b><span class="mut small" id="info"></span><span class="sp"></span>
  <a class="b" id="dl" href="#">⬇ Baixar</a></header>
<main id="main"><div class="center mut">Abrindo…</div></main>
<script src="/lib/plotly.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const path = new URLSearchParams(location.search).get('path') || '';
const url = '/files/' + path.split('/').map(encodeURIComponent).join('/');
const col = n => { let s = ''; for (n++; n > 0; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + (n - 1) % 26) + s; return s; };
const PAL = ['#2F6DB5', '#22A38A', '#F2A33A', '#E0605E', '#8A6FD1', '#3BA9D9', '#D96BA8', '#7FB43A'];
let FILE = null;

async function boot() {
  $('#dl').href = url + '?download=1';
  const r = await fetch('/api/view?path=' + encodeURIComponent(path));
  if (r.status === 401) { location.href = '/'; return; }
  const d = await r.json();
  if (!r.ok) { $('#main').innerHTML = `<div class="center">${esc(d.detail || 'Não consegui abrir.')}</div>`; return; }
  FILE = d; document.title = d.name; $('#name').textContent = d.name;
  $('#info').textContent = ' · ' + (d.size / 1024).toFixed(1) + ' KB';
  const m = $('#main');
  if (d.kind === 'sheet') { showSheets(d.sheets); return; }
  if (d.kind === 'html') m.innerHTML = `<iframe src="${url}" sandbox="allow-scripts allow-downloads allow-popups"></iframe>`;
  else if (d.kind === 'pdf') {
    $('#info').textContent += ` · ${d.pages} página(s)`;
    m.innerHTML = `<div class="pages">${Array.from({length: d.pages}, (_, i) =>
      `<img loading="lazy" src="/api/view/pdf?path=${encodeURIComponent(path)}&page=${i + 1}" alt="página ${i + 1}">`).join('')}</div>`;
  }
  else if (d.kind === 'image') m.innerHTML = `<div class="center"><img class="full" src="${url}" alt="${esc(d.name)}"></div>`;
  else if (d.kind === 'text') { const pre = document.createElement('pre'); pre.textContent = d.text; m.innerHTML = ''; m.append(pre); }
  else m.innerHTML = `<div class="center"><div>Este tipo de arquivo (.${esc(d.ext)}) não tem visualização.<br><a style="color:var(--acc)" href="${url}?download=1">Baixar</a></div></div>`;
}

function showSheets(sheets) {
  const m = $('#main'); m.innerHTML = '';
  const tabs = document.createElement('div'); tabs.className = 'tabs';
  const body = document.createElement('div');
  sheets.forEach((s, i) => { const b = document.createElement('button'); b.textContent = s.name;
    b.onclick = () => { tabs.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); drawSheet(body, s); };
    tabs.append(b); });
  m.append(tabs, body);
  tabs.children[0].click();
}

function drawSheet(body, s) {
  body.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className = 'sheetwrap';
  const box = document.createElement('div'); box.className = 'sheet';
  const covered = new Set(), span = {};
  for (const [r1, c1, r2, c2] of s.merges) { span[r1 + ':' + c1] = [r2 - r1 + 1, c2 - c1 + 1];
    for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) if (r !== r1 || c !== c1) covered.add(r + ':' + c); }
  const RH = 22, HW = 40;  // cabeçalho de colunas e números das linhas
  const tw = HW + s.widths.reduce((a, b) => a + b, 0);
  let html = `<table class="g ${s.grid === false ? 'nogrid' : ''}" style="width:${tw}px"><colgroup><col style="width:${HW}px">${s.widths.map(w => `<col style="width:${w}px">`).join('')}</colgroup>`;
  html += `<tr style="height:${RH}px"><th></th>${s.widths.map((_, i) => `<th>${col(i)}</th>`).join('')}</tr>`;
  s.rows.forEach((row, ri) => {
    const r = ri + 1, h = s.heights[ri] || 20;
    html += `<tr style="height:${h}px"><td class="rh">${r}</td>`;
    row.forEach((c, ci) => {
      const k = r + ':' + (ci + 1); if (covered.has(k)) return;
      const sp = span[k], st = [];
      if (c.b) st.push('font-weight:700'); if (c.sz) st.push(`font-size:${c.sz * 4 / 3}px`); if (c.c) st.push('color:' + c.c);
      if (c.bg) st.push('background:' + c.bg); if (c.al) st.push('text-align:' + c.al);
      html += `<td${sp ? ` rowspan="${sp[0]}" colspan="${sp[1]}"` : ''} class="${c.n ? 'n' : c.v && !sp ? 't' : ''}" style="${st.join(';')}" title="${esc(c.v)}">${esc(c.v)}</td>`;
    });
    html += '</tr>';
  });
  html += '</table>';
  box.innerHTML = html; wrap.append(box); body.append(wrap);
  if (s.truncated) body.insertAdjacentHTML('beforeend', '<div class="note">Mostrando as primeiras 500 linhas e 60 colunas. Baixe o arquivo para ver tudo.</div>');
  // gráficos do próprio arquivo, na posição em que estão na planilha
  const xs = [HW], ys = [RH];
  s.widths.forEach(w => xs.push(xs[xs.length - 1] + w + 1));
  s.rows.forEach((_, i) => ys.push(ys[ys.length - 1] + (s.heights[i] || 20) + 1));
  const at = (arr, i, def) => i < arr.length ? arr[i] : arr[arr.length - 1] + (i - arr.length + 1) * def;
  let maxW = box.offsetWidth, maxH = box.offsetHeight;
  for (const ch of s.charts) {
    const a = ch.anchor || {}, f = a.from || {col: 0, row: 0, colOff: 0, rowOff: 0};
    const left = at(xs, f.col, 65) + (f.colOff || 0), top = at(ys, f.row, 21) + (f.rowOff || 0);
    let w = a.w, hgt = a.h;
    if (a.to) { w = at(xs, a.to.col, 65) + a.to.colOff - left; hgt = at(ys, a.to.row, 21) + a.to.rowOff - top; }
    w = w || 480; hgt = hgt || 288;
    const div = document.createElement('div'); div.className = 'chart';
    Object.assign(div.style, {left: left + 'px', top: top + 'px', width: w + 'px', height: hgt + 'px'});
    box.append(div);
    maxW = Math.max(maxW, left + w + 10); maxH = Math.max(maxH, top + hgt + 10);
    plot(div, ch);
  }
  box.style.minWidth = maxW + 'px'; box.style.minHeight = maxH + 'px';
}

function plot(div, ch) {
  if (!window.Plotly) { div.textContent = ch.title || 'gráfico'; return; }
  const hz = ch.series.some(s => s.horizontal);
  const traces = ch.series.map((s, i) => {
    const color = PAL[i % PAL.length];
    if (s.type === 'pie' || s.type === 'doughnut') return {type: 'pie', labels: s.x, values: s.y, hole: s.type === 'doughnut' ? .5 : 0, name: s.name,
      marker: {colors: PAL}, textinfo: 'label+percent', textposition: 'inside', sort: false};
    if (s.type === 'bar') return s.horizontal ? {type: 'bar', orientation: 'h', y: s.x, x: s.y, name: s.name, marker: {color}}
      : {type: 'bar', x: s.x, y: s.y, name: s.name, marker: {color}};
    if (s.type === 'area') return {type: 'scatter', mode: 'lines', fill: 'tozeroy', x: s.x, y: s.y, name: s.name, line: {color}};
    if (s.type === 'scatter') return {type: 'scatter', mode: 'markers', x: s.x, y: s.y, name: s.name, marker: {color}};
    return {type: 'scatter', mode: 'lines+markers', x: s.x, y: s.y, name: s.name, line: {color}};
  });
  Plotly.newPlot(div, traces, {title: {text: ch.title || '', font: {size: 14}}, margin: {l: 50, r: 16, t: ch.title ? 40 : 14, b: 40},
    showlegend: ch.series.length > 1 || ch.type === 'pie' || ch.type === 'doughnut', legend: {orientation: 'h'},
    xaxis: hz ? {automargin: true, separatethousands: true} : {type: 'category', automargin: true},
    yaxis: hz ? {type: 'category', automargin: true, autorange: 'reversed'} : {automargin: true, separatethousands: true}, separators: ',.',
    paper_bgcolor: '#fff', plot_bgcolor: '#fff', font: {family: 'Segoe UI, Arial', color: '#1f2937'}},
    {displaylogo: false, responsive: true, locale: 'pt-BR'});
}
boot();
</script>
</html>
